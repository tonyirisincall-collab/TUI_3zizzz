  {q:'Returning TUI customer',a:'"Have you travelled with TUI before? What did you enjoy most last time?"',tip:'Builds loyalty and shows you value their history.'},
  {q:'Close to departure',a:'"Not long to go now! What\'s the first thing you\'ll do when you land?"',tip:'Ends the call on a happy picture.'},
  {q:'Before closing any call',a:'"Is there anything else that would make the trip better for you?"',tip:'Often reveals an extra: seats, transfer, room request.'}]},
 {t:'compare',title:'Questions that work vs questions to avoid',sub:'With UK customers, ask about the trip, not about the person.',left:'Good to ask',right:'Avoid',rows:[
  ['Is it your first time visiting?','How old are you?'],
  ['Who\'s travelling with you?','Are you married? Are you alone?'],
  ['Is it for a special occasion?','Why are you travelling alone?'],
  ['Do you have a budget in mind?','How much do you earn?'],
  ['What are you most looking forward to?','Where are you really from?'],
  ['Would you like any assistance arranged?','Do you have a disability?']]},
 {t:'drill',title:'Tricky rapport moments',sub:'Small cultural details that make a big difference.',lead:'Situation',items:[
  {q:'Customer greets you: "You alright?"',a:'"I\'m very well, thank you, and how are you? How can I help today?"',tip:'It is a greeting, not a real question. Answer briefly and return the question.'},
  {q:'Older customer calls you "love" or "dear"',a:'(Stay warm, don\'t correct them.) "Thank you, let\'s get this sorted for you."',tip:'It is friendly in the UK. Smile and carry on.'},
  {q:'Customer is quiet and short with answers',a:'"No problem, I\'ll keep this quick and simple. I just need [detail] and we\'ll be done in a couple of minutes."',tip:'Efficiency is their way of feeling looked after.'},
  {q:'Customer is very chatty and goes off topic',a:'"That sounds lovely. So I can make sure I get everything done for you, may I just confirm [detail]?"',tip:'Be warm, then steer gently with "so I can...".'},
  {q:'Customer says: "Sorry to be a bother."',a:'"You\'re not a bother at all, that\'s exactly what I\'m here for."',tip:'Reassure, then continue.'},
  {q:'You made a small mistake',a:'"I do apologise, that was my mistake. Let me fix that right away."',tip:'A short, calm apology works better than a long one in British English.'}]}
]},

{id:'map',name:'Mind Map',icon:'target',acc:'#7c3aed',soft:'#ede9fe',slides:[
 {t:'mind',title:'Mind map: tap to explore',sub:'Not sure where to look? Start in the middle and tap your way down. Every branch ends on the exact script you need.'}
]},
{id:'call',name:'Call Mode',icon:'headset',acc:'#0f766e',soft:'#ccfbf1',slides:[
 {t:'cards',title:'Call Mode: your 7 steps',sub:'Open this during a call. One line per step, plus quick buttons to jump to what you need.',cards:[
  {i:'phone',h:'1. Open',p:'"Good morning/afternoon, thank you for calling TUI. You\'re through to [your name]. Who am I speaking to today?"'},
  {i:'lock',h:'2. Verify',p:'"Before I can access your booking details, I\'ll need to confirm a few details with you."'},
  {i:'search',h:'3. Discover',p:'"Who\'s travelling, and is it for anything special?"'},
  {i:'check',h:'4. Resolve',p:'"Here\'s what I can do for you..."'},
  {i:'trend',h:'5. Add value',p:'"Because you mentioned [need], would you like me to add [extra]?"'},
  {i:'list',h:'6. Confirm',p:'"Just to summarise: [actions]. Is there anything else I can help with?"'},
  {i:'heart',h:'7. Close',p:'"Thank you for choosing TUI. Have a wonderful holiday!"'}],links:[['home','Hotels','Room types: what customers ask about'],['plane','Flights','Flight extras customers can add'],['globe','Destinations','Where customers travel'],['heart','Rapport','Conversation starters (trip and general)'],['tag','Price objection','Price objections (1)'],['frown','Angry customer','De-escalation: H.E.A.R.D.']]},
 {t:'drill',title:'Buying time (while you search)',sub:'Use these any time you are searching, checking or waiting for the system. Tap the Stall tab at the top and a reminder bar appears and disappears by itself while you work.',lead:'When',items:[
  {q:'You are searching for the booking',a:'"Bear with me one moment while I pull that up for you."',tip:'Calm and polite. Say it before the silence starts.'},
  {q:'The system is slow',a:'"Thank you for your patience, my system is taking a moment. While it loads, is it your first time visiting [destination]?"',tip:'Turn waiting time into rapport.'},
  {q:'You need to check with the hotel or airline',a:'"I\'m just confirming that for you, it won\'t take long. Is it all right if I place you on a brief hold?"',tip:'Always ask permission before a hold.'},
  {q:'You are not sure of the answer yet',a:'"That\'s a good question. I want to give you the right information, so let me double-check."',tip:'Never guess. Checking builds trust.'},
  {q:'You are reading the notes or the rules',a:'"Let me just have a look at the details so I can explain it properly."',tip:'Tell them what you are doing so they feel looked after.'},
  {q:'You are back after a hold',a:'"Thank you so much for holding, and sorry for the wait. I\'ve got that for you now."',tip:'Thank, apologise once, then deliver.'},
  {q:'It is taking longer than expected',a:'"I\'m sorry, this is taking a little longer than I hoped. I\'m nearly there, thank you for bearing with me."',tip:'Update them every 30 to 60 seconds.'},
  {q:'You want to fill silence with rapport',a:'"While I\'m doing that, are you looking forward to the trip?"',tip:'One light question, then listen.'}]},
 {t:'notes',title:'Call notes: fill and copy',sub:'Fill in 30 seconds, press Copy, then paste into your system. Clear notes mean fewer repeat calls and better quality scores.'}
]},
{id:'dest',name:'Destinations',icon:'globe',acc:'#b45309',soft:'#fef3c7',slides:[
 {t:'dest',title:'Where customers travel',groups:[['Europe: sun and beaches',['Spain','Portugal','Greece','Turkey','Cyprus','Malta','Croatia']],['Europe: city breaks',['France','Italy','Germany','Netherlands']],['Middle East and Africa',['United Arab Emirates','Egypt','Morocco','Tunisia','Jordan','Cape Verde','Kenya']],['Americas',['United States','Canada','Mexico','Dominican Republic','Jamaica','Barbados']],['Asia and Pacific',['Thailand','Maldives','Sri Lanka','Indonesia (Bali)','Japan','Australia']]],sub:'Tap a country on the map, or a name below. Use the landmarks and questions to build rapport. Check current details before quoting anything.',items:[
  {n:'Spain',f:['Apr-Jun and Sep-Oct (summer is hot)','About 2.5 hrs (Canaries about 4.5)','Euro','Spanish'],ab:'ES',lat:40.4,lon:-3.7,lm:['Sagrada Familia, Barcelona','Alhambra, Granada','Beaches of Mallorca and Costa del Sol','Mount Teide, Tenerife'],talk:'Spain suits almost everyone: easy flights, great food, city breaks, beach resorts and islands. Ask whether they want mainland or islands.',qs:['Is it your first time in Spain?','Are you after a beach resort or a city break?','Do you like the idea of the islands, like Tenerife or Mallorca?']},
  {n:'Portugal',f:['Apr-Oct','About 2.5-3 hrs','Euro','Portuguese'],ab:'PT',lat:39.4,lon:-8.2,lm:['Lisbon trams and Belem Tower','Algarve beaches and cliffs','Madeira gardens and hiking'],talk:'Portugal feels relaxed and good value, with lovely beaches and great food. The Algarve is popular for families and golf.',qs:['Have you been to Portugal before?','Do you prefer the Algarve beaches or a city like Lisbon?','Are you a fan of golf or walking holidays?']},
  {n:'Italy',f:['Apr-Jun and Sep-Oct','About 2.5 hrs','Euro','Italian'],ab:'IT',lat:42.5,lon:12.5,lm:['Colosseum, Rome','Venice canals','Amalfi Coast','Lake Garda'],talk:'Italy is about food, history and scenery. Ask what kind of trip they want: city sights, lakes or coast.',qs:['Is Italy somewhere you have wanted to visit for a while?','Are you more into history and cities, or lakes and coast?','What is the one thing you would love to eat there?']},
  {n:'Greece',f:['May-Jun and Sep-Oct','About 3.5-4 hrs','Euro','Greek'],ab:'GR',lat:39,lon:22,lm:['Acropolis, Athens','Santorini sunsets','Beaches of Crete, Rhodes and Corfu'],talk:'Greece has the classic island holiday: sunshine, beaches and lovely evenings by the sea. Each island has its own feel.',qs:['Have you been to the Greek islands before?','Do you want lively resorts or somewhere quieter?','Are you travelling with the family or as a couple?']},
  {n:'Turkey',f:['May-Jun and Sep-Oct','About 4 hrs','Turkish lira','Turkish'],ab:'TR',lat:39,lon:35,lm:['Hagia Sophia, Istanbul','Cappadocia balloon flights','Ephesus ruins','Resorts at Antalya, Dalaman and Bodrum'],talk:'Turkey is popular for all inclusive resorts and good value, and has fascinating history if they want a day out.',qs:['Is it a resort holiday you are after?','Do you like the all inclusive style?','Would you want any day trips, like the ruins or Istanbul?']},
  {n:'Cyprus',f:['Apr-Nov, warm into autumn','About 4.5-5 hrs','Euro','Greek (English widely spoken)'],ab:'CY',lat:35,lon:33,lm:['Paphos archaeological sites','Ayia Napa beaches','Petra tou Romiou (Aphrodite\'s Rock)'],talk:'Cyprus has a long season, with warm weather well into the autumn. It works for families, couples and for beach and history lovers.',qs:['Have you been to Cyprus before?','Are you after lively Ayia Napa or quiet Paphos?','When are you hoping to travel?']},
  {n:'Egypt',f:['Oct-Apr (summer is very hot)','About 5-5.5 hrs','Egyptian pound','Arabic'],ab:'EG',lat:26.8,lon:30.8,lm:['Pyramids of Giza','Red Sea snorkelling and diving','Luxor and a Nile cruise','Sharm El Sheikh and Hurghada resorts'],talk:'Egypt combines year-round sun with famous history. Many customers pair a beach resort with a day trip.',qs:['Is this your first time in Egypt?','Are you keen on the beach and snorkelling, or the history?','Would you like to see the pyramids on a day trip?']},
  {n:'United Arab Emirates',f:['Nov-Mar (summer is very hot)','About 7 hrs','UAE dirham','Arabic (English widely spoken)'],ab:'UAE',full:'United Arab Emirates',lat:24,lon:54,lm:['Burj Khalifa and Dubai Mall','Palm Jumeirah and beaches','Sheikh Zayed Grand Mosque, Abu Dhabi','Desert safari'],talk:'The UAE is great for winter sun, shopping, family attractions and luxury stays. Dubai is the most popular, and Abu Dhabi is calmer and more cultural.',qs:['Have you been to Dubai before?','Are you more into shopping and attractions, or beach and relaxing?','Is it a special occasion trip?']},
  {n:'Morocco',f:['Mar-May and Sep-Nov','About 3.5-4 hrs','Moroccan dirham','Arabic and French'],ab:'MA',lat:32,lon:-7,lm:['Marrakech souks and Jemaa el-Fnaa square','Atlas Mountains and desert trips','Agadir beaches'],talk:'Morocco is colourful and different, a short flight from the UK. Combine the buzz of Marrakech with a beach stay.',qs:['Is Morocco a new destination for you?','Do you fancy the markets of Marrakech or a beach in Agadir?','Are you comfortable with a day trip into the mountains or desert?']},
  {n:'Cape Verde',f:['Year-round sunshine','About 6 hrs','Cape Verdean escudo','Portuguese'],ab:'CV',lat:16,lon:-24,lm:['Sal and Boa Vista beaches','Year-round sunshine','All inclusive resorts'],talk:'Cape Verde is a popular winter sun choice, with warm weather most of the year and relaxed beach resorts.',qs:['Are you looking for winter sun?','Do you like all inclusive resorts?','Are you after a quiet beach break or something lively?']},
  {n:'United States',f:['Varies by area (Orlando: spring and autumn)','About 8-10 hrs (Orlando about 9)','US dollar','English'],ab:'USA',full:'United States of America',lat:38,lon:-98,lm:['Walt Disney World, Orlando','Statue of Liberty, New York','Las Vegas Strip','Florida beaches'],talk:'The USA is a big trip, often a once-in-a-lifetime one. Orlando is a family favourite, and New York is great for city breaks. Always point customers to official entry guidance.',qs:['Is this your first trip to America?','Are you thinking theme parks, a city break or a road trip?','Are you celebrating anything special?']},
  {n:'Mexico',f:['Nov-Apr','About 10-11 hrs (Cancun)','Mexican peso','Spanish'],ab:'MX',lat:23,lon:-102,lm:['Cancun and Riviera Maya beaches','Chichen Itza','Tulum ruins on the coast'],talk:'Mexico mixes white-sand beaches with Mayan history. Popular for honeymoons and all inclusive holidays.',qs:['Have you been to Mexico before?','Are you after beaches, history, or a bit of both?','Is it a honeymoon or anniversary trip?']},
  {n:'Maldives',f:['Nov-Apr','About 10.5 hrs','Maldivian rufiyaa (US dollars widely used)','Dhivehi (English widely spoken)'],ab:'MV',lat:3.2,lon:73.2,lm:['Overwater villas','Snorkelling over coral reefs','Private island resorts'],talk:'The Maldives is a dream destination, usually for honeymoons and special occasions. Ask about occasion and budget gently.',qs:['Is it a honeymoon or a special celebration?','What would your perfect day there look like?','Do you love snorkelling or just relaxing?']},
  {n:'Thailand',f:['Nov-Mar','About 11.5 hrs (Bangkok)','Thai baht','Thai'],ab:'TH',lat:15.9,lon:100.9,lm:['Grand Palace and temples, Bangkok','Phuket and Koh Samui beaches','Elephant sanctuaries near Chiang Mai'],talk:'Thailand offers beaches, culture and street food, great for longer trips and twin-centre holidays. If asked about animal tourism, suggest checking ethical options.',qs:['Is this your first trip to Thailand?','Do you want a city, beaches, or a twin-centre of both?','Are you a fan of Thai food?']},
  {n:'France',f:['Spring and autumn for Paris','About 1.5 hrs (Paris)','Euro','French'],ab:'FR',lat:46.6,lon:2.4,lm:['Eiffel Tower and the Louvre, Paris','Disneyland Paris','French Riviera: Nice and Cannes','Mont Saint-Michel'],talk:'France is perfect for a city break in Paris, a family trip to Disneyland, or sun on the Riviera. It is close, so short breaks are easy.',qs:['Is it your first time in Paris?','Are you after a city break or sun and sea?','Are you thinking of Disneyland with the children?']},
  {n:'Malta',f:['Apr-Jun and Sep-Oct','About 3.5 hrs','Euro','Maltese and English'],ab:'MT',lat:35.9,lon:14.4,lm:['Valletta old town','Blue Lagoon, Comino','Mdina, the silent city'],talk:'Malta is sunny, easy and English-speaking, with history and beaches in a small space. A good short-haul choice.',qs:['Have you been to Malta before?','Do you prefer history and old towns, or beach days?','How long are you thinking of going for?']},
  {n:'Croatia',f:['May-Jun and Sep','About 2.5-3 hrs','Euro','Croatian'],ab:'HR',lat:45.1,lon:15.2,lm:['Dubrovnik city walls','Plitvice Lakes','Split and Diocletian\'s Palace','Hvar island'],talk:'Croatia has a beautiful coast and islands, great for couples and island hopping.',qs:['Is Croatia somewhere you have wanted to visit?','Are you into island hopping or one base?','Do you enjoy sailing or boat trips?']},
  {n:'Germany',f:['Dec for Christmas markets, or summer','About 1.5-2 hrs','Euro','German'],ab:'DE',lat:51.2,lon:10.4,lm:['Brandenburg Gate, Berlin','Neuschwanstein Castle','Christmas markets in Cologne and Nuremberg','Munich'],talk:'Germany suits city breaks and festive Christmas market trips. Ask when they plan to travel.',qs:['Is it a city break or the Christmas markets?','Have you been to Germany before?','Are you into history, food or castles?']},
  {n:'Netherlands',f:['Apr-May for tulips','About 1 hr','Euro','Dutch'],ab:'NL',lat:52.1,lon:5.3,lm:['Amsterdam canals','Van Gogh Museum','Keukenhof tulip gardens (spring)'],talk:'The Netherlands is a lovely short break, with canals, museums and spring tulips.',qs:['Is it a city break?','Are you tempted by the tulip season?','Are you travelling as a couple or with friends?']},
  {n:'Tunisia',f:['May-Jun and Sep-Oct','About 3.5 hrs','Tunisian dinar','Arabic and French'],ab:'TN',lat:34,lon:9,lm:['Carthage ruins','Sidi Bou Said blue and white village','Djerba island beaches'],talk:'Tunisia offers warm beach holidays with history close by, often at good value.',qs:['Is it a beach holiday you are after?','Do you like all inclusive?','Would you like a day trip to see the ruins?']},
  {n:'Jordan',f:['Mar-May and Sep-Nov','About 5 hrs','Jordanian dinar','Arabic'],ab:'JO',lat:31,lon:36.5,lm:['Petra','Wadi Rum desert','Dead Sea floating'],talk:'Jordan is for travellers who love history and adventure, and Petra is the star. Often combined with a Red Sea or Dead Sea stay.',qs:['Is Petra on your wish list?','Do you like adventure and the outdoors?','Would you add a Dead Sea stay to relax?']},
  {n:'Kenya',f:['Jun-Oct for safari','About 8.5 hrs','Kenyan shilling','Swahili and English'],ab:'KE',lat:-0.02,lon:37.9,lm:['Masai Mara safari','Diani Beach','Amboseli, with views of Kilimanjaro'],talk:'Kenya is a classic safari and beach combination. Ask what they most want to see.',qs:['Is a safari a lifelong dream?','Which animals would you love to see?','Would you like beach time after the safari?']},
  {n:'Canada',f:['Jun-Sep, or autumn for colours','About 7.5-9 hrs','Canadian dollar','English and French'],ab:'CA',lat:56,lon:-106,lm:['Niagara Falls','Banff and Lake Louise','CN Tower, Toronto','Vancouver and the Rockies'],talk:'Canada is about big scenery, friendly cities and the great outdoors. Great for road trips and rail journeys.',qs:['Is it nature or cities you love most?','Are you thinking summer or autumn colours?','Have you been to Canada before?']},
  {n:'Dominican Republic',f:['Nov-Apr','About 9 hrs','Dominican peso','Spanish'],ab:'DO',lat:18.7,lon:-70.2,lm:['Punta Cana beaches','Santo Domingo colonial zone','Saona Island'],talk:'The Dominican Republic is a classic all inclusive Caribbean holiday with long white beaches.',qs:['Is it your first Caribbean holiday?','Do you like all inclusive resorts?','Is it a family trip or a couple\'s break?']},
  {n:'Jamaica',f:['Nov-Apr','About 9.5 hrs','Jamaican dollar','English'],ab:'JM',lat:18.1,lon:-77.3,lm:['Negril Seven Mile Beach','Dunn\'s River Falls','Bob Marley Museum, Kingston'],talk:'Jamaica has beaches, music and relaxed island life. A great honeymoon and family choice.',qs:['Is it a honeymoon or celebration trip?','Are you a reggae fan?','Do you want a quiet beach or lively resort?']},
  {n:'Barbados',f:['Dec-Apr','About 8.5 hrs','Barbados dollar','English'],ab:'BB',lat:13.2,lon:-59.5,lm:['West coast beaches','Harrison\'s Cave','Oistins fish fry','Bridgetown heritage'],talk:'Barbados is the polished Caribbean choice: lovely beaches, great food and a very welcoming feel.',qs:['Is it a special occasion?','Do you prefer calm west coast beaches or the livelier south?','Have you been to the Caribbean before?']},
  {n:'Sri Lanka',f:['Dec-Mar for the west and south coasts','About 10.5-11 hrs','Sri Lankan rupee','Sinhala and Tamil'],ab:'LK',lat:7.9,lon:80.8,lm:['Sigiriya Rock','Temple of the Tooth, Kandy','Yala safari','Southern beaches'],talk:'Sri Lanka packs culture, wildlife, tea hills and beaches into one island. Perfect for twin-centre trips.',qs:['Is it your first time in Sri Lanka?','Culture, wildlife or beaches?','Would you like a twin-centre with a beach stay?']},
  {n:'Indonesia (Bali)',f:['Apr-Oct (dry season)','About 16+ hrs with a stop','Indonesian rupiah','Indonesian'],ab:'ID',lat:-8.4,lon:115.2,lm:['Uluwatu temple','Ubud rice terraces','Seminyak beaches'],talk:'Bali mixes culture, wellness and beaches. A favourite for honeymoons and long-haul adventures.',qs:['Is it a honeymoon or a big adventure?','Do you prefer beach, culture or wellness?','Have you been to Asia before?']},
  {n:'Japan',f:['Mar-May and Oct-Nov','About 14 hrs','Japanese yen','Japanese'],ab:'JP',lat:36.2,lon:138.3,lm:['Tokyo','Mount Fuji','Kyoto temples','Cherry blossom season (spring)'],talk:'Japan is a bucket-list trip, mixing hi-tech cities, temples and fantastic food. Ask what time of year they want to go.',qs:['Is Japan on your bucket list?','Do you want cherry blossom season?','Are you more into food, culture or cities?']},
  {n:'Australia',f:['Varies by region and season','About 22 hrs with a stop','Australian dollar','English'],ab:'AU',lat:-25,lon:134,lm:['Sydney Opera House','Great Barrier Reef','Uluru','Melbourne'],talk:'Australia is a once-in-a-lifetime long-haul trip. Ask how long they have and which cities or sights matter most.',qs:['Is it a trip you have been planning for a while?','Cities, reef or outback?','How long are you thinking of going for?']}

 ]}
]},

{id:'ptc',name:'Pre-Travel: Common calls',icon:'file',acc:'#be185d',soft:'#fce7f3',slides:[
 {t:'drill',title:'Payments and documents',sub:'The most common reasons customers call before they travel.',lead:'Customer says',items:[
  {q:'"When do I need to pay the balance?"',a:'"Let me check your booking. The balance of £[X] is due by [date]. Would you like to pay now, or shall I note it for you?"',tip:'Quote the exact date and amount. Stay helpful, never threatening.'},
  {q:'"My payment didn\'t go through."',a:'"I\'m sorry about that. It can happen because of a bank security check or a limit. Would you like to try another card, or would you prefer to contact your bank first? The balance is still due by [date]."',tip:'No blame. Offer two simple options and repeat the due date.'},
  {q:'"I haven\'t received my e-tickets or documents."',a:'"No problem. Let me check the email address on file. [Read back.] I\'ll resend them now and they should arrive within [X]. Please check your junk folder too."',tip:'Check your account\'s release timing before saying they are late.'},
  {q:'"My passport expires soon. Is that okay?"',a:'"Entry rules depend on the destination, and many countries need a minimum validity on the travel date. I\'d recommend checking GOV.UK foreign travel advice for [destination] to be sure."',tip:'Point to the official source. Do not quote rules from memory.'},
  {q:'"The name on the booking is spelled wrong."',a:'"Names must match the passport exactly, so let\'s fix that. Could you give me the correct spelling? I\'ll check the process and whether any fee applies. The sooner it\'s corrected the better."',tip:'Treat as urgent, especially close to departure.'},
  {q:'"Can I have a receipt or invoice?"',a:'"Of course. I\'ll send a confirmation with the payment details to [email]. Is that still the best address?"',tip:'Confirm the email and the timeframe.'}]},
 {t:'drill',title:'Changes before travel',sub:'Always give the full cost before you change anything.',lead:'Customer says',items:[
  {q:'"Can I change my room type?"',a:'"Let me check availability and the price difference. I\'ll confirm the full cost before I make any change."',tip:'Availability first, then price, then confirm.'},
  {q:'"Can I change my hotel?"',a:'"Let me look at the options. A change can involve a price difference or fees, so I\'ll go through the exact costs with you before anything is changed."',tip:'Never promise it is free until you have checked.'},
  {q:'"I\'d like to add a traveller."',a:'"Of course. May I have their full name as on the passport and their date of birth? I\'ll check availability and the price before adding them."',tip:'Age on the date of travel decides the fare.'},
  {q:'"What time is my transfer or pick-up?"',a:'"Transfer times are usually confirmed closer to travel. Let me check what I can see on your booking, and I\'ll tell you how and when you\'ll receive the details."',tip:'Never invent a time. Say how the customer will be told.'},
  {q:'"Can I change my flight date?"',a:'"Let me check availability and the fare rules. There may be a change fee and a fare difference, and I\'ll give you the full price before I change anything."',tip:'Always disclose the full cost before committing.'},
  {q:'"I\'d like to upgrade before we travel."',a:'"Great idea. Let me check what\'s available, such as [room type / seats / board basis], and I\'ll give you a clear price."',tip:'Say what it is, what it costs, and ask once.'}]},
 {t:'steps',title:'Pre-departure reminder call',sub:'A friendly call shortly before travel prevents problems and creates happy customers.',steps:[
  {h:'Check the time',p:'"Good morning, Mr/Mrs [Surname], it\'s [Name] from TUI about your trip to [destination]. Is now a good time?"'},
  {h:'Verify',p:'Complete the security check before discussing any booking details.'},
  {h:'Documents',p:'"Have you received your e-tickets and documents? Are all the names and passports correct?"'},
  {h:'Travel details',p:'Check-in times, transfer, baggage allowance and any special requests you noted.'},
  {h:'Extras',p:'"Is there anything you\'d like to add, such as seats, bags or a meal?"'},
  {h:'Warm close',p:'"Not long to go now! Have a wonderful holiday, and call us if you need anything."'}]}
]},

{id:'tools',name:'Tools',icon:'list',acc:'#0369a1',soft:'#e0f2fe',slides:[
 {t:'cards',title:'TUI UK cancellation terms',sub:'Charges for a package holiday with a TUI flight, as a percentage of the total booking price. Checked on tui.co.uk in October 2026. Always confirm in the booking conditions.',cards:[
  {i:'check',h:'70 days or more before travel',p:'Loss of deposit.'},
  {i:'clock',h:'69 to 63 days',p:'30% of the total booking price.'},
  {i:'clock',h:'62 to 49 days',p:'50% of the total booking price.'},
  {i:'alert',h:'48 to 29 days',p:'70% of the total booking price.'},
  {i:'alert',h:'28 to 15 days',p:'90% of the total booking price.'},
  {i:'shield',h:'14 to 0 days',p:'100% of the total booking price.'},
  {i:'card',h:'Deposit is non-refundable',p:'Even if the calculated charge is lower than the deposit paid.'},
  {i:'bag',h:'Non-refundable extras',p:'Their cost is added to the cancellation charge.'},
  {i:'tag',h:'Low Deposit Offer',p:'The full deposit stated on the confirmation invoice is payable on cancellation.'},
  {i:'plane',h:'Flight only, hotel only, tours',p:'Charges are different, and coach tours and scheduled airfares can be higher. Check the booking conditions.'},
  {i:'heart',h:'If TUI cancels',p:'No cancellation fee. A cancellation invoice follows within 14 days of cancelling.'},
  {i:'users',h:'Removing a passenger',p:'The overall holiday cost may go up. Check before confirming.'}]},
 {t:'calc',title:'Calculators: dates and cancellation',sub:'Work out the trip length, or what a customer would pay to cancel today.'},
 {t:'drill',title:'Explaining cancellation charges',sub:'Calm, factual and clear. Use the calculator for the exact figure.',lead:'Customer says',items:[
  {q:'"How much will it cost to cancel?"',a:'"Let me check. It depends on how many days there are before you travel, and it\'s a percentage of the total price. May I confirm your departure date and the total price so I can give you the exact figure?"',tip:'Use the cancellation calculator, then read out the figure.'},
  {q:'"Why do I lose my deposit?"',a:'"Your deposit is non-refundable under the booking terms, even if the cancellation charge works out lower than the deposit. The charges cover our costs and the risk that we can\'t resell the holiday."',tip:'Factual and calm. Do not apologise for the policy.'},
  {q:'"Can I move the dates instead?"',a:'"Let me check. A change can also have a fee and a price difference, so I\'ll compare it with the cancellation charge and give you both figures."',tip:'Compare the two costs before the customer decides.'},
  {q:'"Will my insurance cover it?"',a:'"I can\'t advise on your policy, but it\'s worth checking whether it covers cancellation, for example for unforeseen illness. Your policy documents will tell you what\'s covered."',tip:'Never confirm cover. Point to their policy.'}]}
]},
{id:'ref',name:'TUI reference',icon:'book',acc:'#7e22ce',soft:'#f3e8ff',slides:[
 {t:'drill',title:'TUI app: what to tell customers',sub:'Promote the app before every trip. Say it naturally and tie it to what the customer needs.',lead:'Say',items:[
  {q:'Opening',a:'"Before you travel, I\'d highly recommend downloading the TUI app if you haven\'t already. It\'s completely free and will make your entire holiday experience so much easier!"',tip:'Warm and confident. Then go straight into the benefits.'},
  {q:'Pre-travel features',a:'"The app gives you everything you need before you go: a handy travel checklist to help you prepare, flight check-in and your boarding pass right on your phone, live flight times and transfer information, all your booking details in one place, and weather forecasts for your destination."',tip:'Pick the two or three that fit this customer, rather than reading the whole list.'},
  {q:'Closing',a:'"I\'d suggest downloading it now and having a look around. Make sure to download any important documents before you travel, as some features work best with an internet connection. Is there anything else I can help you with regarding your booking?"',tip:'Then note it under "App?" in your call notes.'},
  {q:'Short version',a:'"The TUI app is free, and it has your checklist, check-in, boarding pass, live flight times and your booking details all in one place."',tip:'For a quick call or a customer in a hurry.'}]},
 {t:'cards',title:'TUI app: key benefits',sub:'Pre-travel features to highlight. The app is free to download.',cards:[
  {i:'list',h:'Travel checklist',p:'A handy checklist to help the customer prepare.'},
  {i:'plane',h:'Check-in and boarding pass',p:'Flight check-in and the boarding pass right on their phone.'},
  {i:'clock',h:'Live flight times and transfers',p:'Live flight times and transfer information.'},
  {i:'file',h:'Booking details in one place',p:'All their booking details together.'},
  {i:'sun',h:'Weather forecast',p:'Weather forecasts for their destination.'},
  {i:'alert',h:'Before they travel',p:'Remind them to download important documents first, as some features work best with an internet connection.'}]},
 {t:'cards',title:'Quality 1: Customer focus',sub:'Warm, personal and attentive from the first word to the last.',cards:[
  {i:'smile',h:'Create a warm welcome',p:'• Use the correct tone of voice and greet the customer warmly\n• Example: "Good morning/afternoon, thank you for calling TUI, my name is [Name], how can I help you today?"'},
  {i:'chat',h:'Active listening',p:'• Let the customer explain without interruption\n• Show empathy and understanding throughout\n• Adjust your tone (softer for frustrated customers)'},
  {i:'heart',h:'Personalised service',p:'• Discuss the holiday with genuine excitement\n• Develop a genuine connection\n• Tailor your responses to their situation'},
  {i:'check',h:'Proper closing',p:'• Tailor the closing to the conversation type\n• Example: "Is there anything else I can help you with today?"'}]},
 {t:'cards',title:'Quality 2: Sales excellence',sub:'Find the opportunity, offer something relevant, and ask for the sale.',cards:[
  {i:'trend',h:'Identify sales opportunities',p:'• Proactively close the sale after introducing ancillaries\n• "Would you like me to add this for you today?" or "Shall we get this saved and add the cost onto your final balance?"'},
  {i:'tag',h:'Offer relevant products',p:'• Introduce and promote personalised benefits of ancillaries, upgrades and excursions\n• Focus on products that enhance the holiday'},
  {i:'shield',h:'Save the sale',p:'• Try to avoid cancellations by offering alternatives or amendments\n• Tell customers about cancellation fees and explain the rebooking incentive clearly'},
  {i:'star',h:'Promote TUI products',p:'• Introduce relevant TUI app features with personalised benefits\n• Know the current sales campaigns, discounts and offers'}]},
 {t:'cards',title:'Quality 3: Expertise',sub:'Protect the customer, the booking and the business.',cards:[
  {i:'lock',h:'Follow GDPR guidelines',p:'• Follow the correct GDPR guidelines for the booking type (outbound statement, customer, third party, retail, etc.)\n• Do not share booking-specific details with unauthorised passengers'},
  {i:'card',h:'Prevent revenue loss',p:'• Follow the correct processes to avoid any financial loss to the business\n• Leave full booking notes after the call\n• Pause the call recording when collecting payment details'}]},
 {t:'cards',title:'Quality 4: Efficiency',sub:'Solve it on the first call, with a clear flow and a connected customer.',cards:[
  {i:'search',h:'Ask effective questions',p:'• Use open and closed questions to understand and resolve queries\n• Example: "Have you had time to look through the options provided in the email? Would you like me to go through these today?"'},
  {i:'target',h:'First contact resolution',p:'• Work in a solution-oriented way\n• Give informative answers that fully address the customer\'s needs'},
  {i:'clock',h:'System proficiency',p:'• Use systems confidently and show high knowledge of products and procedures\n• Manage expectations, for example: "Just to make you aware, you will receive an updated email confirmation within the next 24 hours"'},
  {i:'trend',h:'Balance focus and efficiency',p:'• Structure the call clearly with good conversation flow\n• Stay connected with the customer while working efficiently'}]},
]},
{id:'newc',name:'New content',icon:'file',acc:'#2f6fed',soft:'#e7efff',slides:[
 {t:'drill',title:`GDPR verification: green, red and retail`,sub:`Verify before you discuss any booking details. Use the version that matches the call.`,lead:`Situation`,items:[
  {q:`Opening (every call)`,a:`"Good morning/afternoon, thank you for calling TUI. You're through to [your name]. Who am I speaking to today?"`,tip:`Same opening for every call. Then follow the right verification below.`},
  {q:`Green scenario: standard inbound call`,a:`"Can you confirm your full name please?"\n"Thank you [customer name]. How can I help you today?"`,tip:`Use when the verification is green.`},
  {q:`Red scenario: manual GDPR verification`,a:`"Before I can access your booking details, I'll need to confirm a few details with you. Can you confirm your booking reference please?"\n"Can you confirm your departure date in full, including the day, month, and year?"\n"And can you confirm your full name as it appears on the booking?"\nAfter GDPR passed: "Thank you for confirming those details. How can I help you today?"`,tip:`All three checks. Do not discuss the booking until they pass.`},
  {q:`Retail or third party call`,a:`"Can you confirm your booking reference please?"\n"Can you confirm your departure date in full, including the day, month, and year?"\n"What is the ABTA number for your store?"\nAfter GDPR passed: "Thank you for confirming those details. How can I assist you today?"`,tip:`The store ABTA number is the third check.`}]},
 {t:'drill',title:`Open and closed questions`,sub:`Open questions understand and explore. Closed questions confirm and close.`,lead:`Use`,items:[
  {q:`Open: understanding customer needs`,a:`"What are you most looking forward to on your holiday?"\n"Have you had time to look through the options provided in the email?"\n"Can you tell me more about what happened?"\n"What specifically isn't working with your current booking?"\n"How can I help make your holiday perfect today?"`,tip:`Ask one, then listen.`},
  {q:`Open: exploring solutions`,a:`"Would you like me to go through these options with you today?"\n"What would work better for you?"\n"Is there anything specific you're concerned about?"`,tip:`Let the customer choose the direction.`},
  {q:`Closed: confirming actions`,a:`"Would you like me to add this for you today?"\n"Shall we get this saved and add the cost onto your final balance?"\n"Would you like me to book that for you now?"`,tip:`Use after you introduce an add-on.`},
  {q:`Closed: verifying information`,a:`"Is that correct?"\n"Does that sound good to you?"\n"Are you happy for me to proceed with that?"`,tip:`Confirm before you change anything.`},
  {q:`Closed: closing the sale`,a:`"Can I secure that for you today?"\n"Would you like to confirm this booking?"`,tip:`Ask clearly, then wait.`}]},
 {t:'drill',title:`Seat options script`,sub:`Present the options in this order, then close.`,lead:`Say`,items:[
  {q:`Opening approach`,a:`"I'd love to help you make your flight experience even more comfortable! We have several seating options available that you can choose from to suit your preferences."`,tip:`Warm start, then go through the options.`},
  {q:`1. Select Your Seat (standard seating)`,a:`"You can choose your exact seat on the aircraft - whether you prefer a window view, easy aisle access, or want to sit together with your travel companions. This gives you complete control over where you'll be sitting."`,tip:`Code: SYS.`},
  {q:`2. Extra Legroom seats`,a:`"If you'd like more space to stretch out and relax during your flight, our Extra Legroom seats offer additional leg space, making your journey more comfortable - perfect for longer flights or if you're tall."`,tip:`Code: XLEG.`},
  {q:`3. Extra Space seats`,a:`"These seats provide you with extra room and comfort throughout your flight, giving you more personal space to enjoy your journey."`,tip:`Code: XSPC.`},
  {q:`4. Premium seats (long-haul flights only)`,a:`"For our long-haul flights, we offer Premium seating which includes enhanced comfort and additional benefits to make your flight experience truly special."`,tip:`Only offer on long-haul flights.`},
  {q:`Key benefits: book early, flexibility, peace of mind`,a:`Book early: "The best part is, you can select your seats right after booking your holiday, so you don't have to worry about it later."\nFlexibility: "If you're travelling as a group, different members can choose different seating types based on their preferences - some might prefer standard seats whilst others opt for extra legroom."\nPeace of mind: "Your seat selection and seat numbers will be confirmed on your booking confirmation, so you'll know exactly where you're sitting before you travel."`,tip:`Pick the benefit that fits this customer.`},
  {q:`Closing`,a:`"Would you like me to add any of these seating options to your booking today? I can help you select the perfect seats for your journey."`,tip:`A closed question. Then wait for the answer.`}]},
 {t:'steps',title:`Infant seat booked as a child`,sub:`When an infant needs their own flight seat at age 2, book them as a 2-year-old child.`,steps:[
  {h:`Quote the child fare`,p:`Create a child flight quote using the flight-only ABTA number H1079 to find the cost.`},
  {h:`Amend transport pair`,p:`In the original booking, select the flight service line and click "Amend transport pair".`},
  {h:`Change the infant to a child`,p:`Change the infant to a child in the search field. When prompted for age, enter 2 years old.`},
  {h:`Select the same flights`,p:`Choose the same flights as the rest of the booking.`},
  {h:`Passenger name page`,p:`Select "New" and change the passenger type to "child". Enter the same details as the infant, with a date of birth that makes them 2 years old.`},
  {h:`Adjust the price`,p:`Use PRID or PRII codes to match the child cost quoted earlier.`}],note:`Flight-only bookings: enter the infant as a CHILD aged 2 and add a note that this is an infant with a flight seat booking. The infant is charged the child rate. If the infant uses a car seat onboard, add SSR code "INCS" on SkySpeed, and seat them in a window seat.`},
 {t:'steps',title:`Full read back: what to cover`,sub:`Read the whole booking back to the customer before you finish.`,steps:[
  {h:`Flights`,p:`Route, dates and times. For example: "You're flying from Manchester to Palma on 15th July at 10:30am, returning on 22nd July at 6:45pm..."`},
  {h:`Passengers`,p:`Names exactly as they appear on the passports, and dates of birth.`},
  {h:`Accommodation`,p:`The hotel and the rooms, for example "the Sunset Beach Resort with two standard rooms".`},
  {h:`Extras`,p:`Luggage added and seat numbers (for example 12A, 12B and 12C).`},
  {h:`Price and payments`,p:`Total holiday price, the deposit paid today, and the balance with its due date.`},
  {h:`Information given`,p:`Resort transfer times, the Travel Aware guidelines, and the Package Travel Regulations information.`},
  {h:`Add the memo`,p:`After the customer confirms, add the mandatory memo to the booking.`}],note:`Then answer "Full read back given" in your call notes.`},
 {t:'drill',title:`Explaining fees and payments`,sub:`Clear, calm and factual.`,lead:`Situation`,items:[
  {q:`Customer is frustrated by amendment fees`,a:`"I understand amendment fees can be frustrating. These fees cover the costs we incur when making changes with airlines, hotels, and other suppliers. The terms were outlined at booking, but let me see what options might be available to help..."`,tip:`Acknowledge the frustration, explain what the fee covers, say the terms were agreed at booking, offer alternatives (e.g. an insurance claim if applicable) and mention flexibility options for future bookings.`},
  {q:`Direct Debit instalments`,a:`"Now let me explain your payment schedule. You've chosen to pay by Direct Debit with monthly instalments. Today, you'll pay the first deposit of £[X], which is your initial payment. Then you'll have [4] further monthly payments of £[X] each, taken automatically on the [20th] of each month - that's [20th April, 20th May, 20th June], and your final balance on [20th July]."`,tip:`Say each date and amount clearly.`},
  {q:`Admin fee: nothing to collect now`,a:`"I can help with that amendment. Let me check your payment status... Great news! You've already paid enough to cover the admin fee, so there's nothing additional to pay right now. The £[X] admin fee will be deducted from what you've already paid."`,tip:`When the customer has paid more than deposit + admin fees.`},
  {q:`Admin fee: must be paid today`,a:`"For this amendment, there's a £[X] admin fee that needs to be paid today. Just so you're aware, this fee is non-refundable, even if you cancel later. Would you like to proceed?"`,tip:`When the customer has paid less than deposit + admin fees.`},
  {q:`After the amendment`,a:`"Your Direct Debit payments will automatically adjust to match the new booking cost."`,tip:`Atcom adjusts Direct Debits automatically.`}]},
 {t:'cards',title:`Admin fees: when to collect`,sub:`Compare what the customer has already paid with (deposit + admin fees).`,cards:[
  {i:`check`,h:`Paid MORE than deposit + admin fees`,p:`Do not collect the fees now. The fee comes out of what they have already paid.`},
  {i:`alert`,h:`Paid LESS than deposit + admin fees`,p:`You MUST collect the fees immediately.`},
  {i:`card`,h:`Deposits`,p:`The deposit must be taken at the time of booking. Check TUI Know-How for the deposit amounts.`},
  {i:`clock`,h:`Outstanding low deposit`,p:`You can amend before the customer pays the full deposit balance. You do not need to collect the outstanding deposit first. Only collect the new admin fee.`},
  {i:`refresh`,h:`After amendments`,p:`Atcom adjusts Direct Debit payments automatically. Wait at least 5 days after the customer's most recent Direct Debit before processing refunds.`},
  {i:`file`,h:`Example`,p:`Deposit required £400, customer paid £1,000, admin fees £100. Total needed £500. £1,000 is more than £500, so do not collect the £100 now.`}]},
 {t:'cards',title:`Atcom: amendments`,sub:`Steps 1 to 3 are the same for every change. The final steps depend on the type.`,cards:[
  {i:`list`,h:`Steps 1 to 3 (all changes)`,p:`1. Tick the checkbox in front of the accommodation service line\n2. Click "Menu"\n3. Select the option for what you are changing`},
  {i:`home`,h:`Board basis upgrade`,p:`After Menu: "Modify External Accommodation Details"\nChange the Internal Board Code to match the upgrade\nClick "Update", then "Close"`},
  {i:`star`,h:`Room type upgrade`,p:`After Menu: "Modify External Accommodation Details"\nChange the External Room Description to match the upgrade\nClick "Refresh", then "Update"`},
  {i:`clock`,h:`Dates, destination or duration`,p:`After Menu: "Amend Inclusive"\nFollow the booking flow (dates, flights, accommodation)\nInsurance drops to a cancelled service line if applicable`},
  {i:`card`,h:`Adding costs (PRII)`,p:`Tick the accommodation, then Service > Override Cost\nEnter code PRII, quantity 1, the cost and the currency\nTick all passengers and click "Update"`},
  {i:`alert`,h:`Multicentre bookings`,p:`Always apply PRII or PRID codes to the first accommodation line only.`}]},
 {t:'steps',title:`Atcom: cancelling a booking`,sub:`Follow the steps in order.`,steps:[
  {h:`Tick the accommodation line`,p:`Tick the checkbox in front of the accommodation service line.`},
  {h:`Menu`,p:`Click "Menu".`},
  {h:`Cancel`,p:`Select "Cancel".`},
  {h:`Show the fees`,p:`Display the cancellation fees to the customer.`},
  {h:`Reason`,p:`Select a reason for cancellation.`},
  {h:`Other`,p:`Select "Other" and give a detailed reason.`},
  {h:`Continue`,p:`Click "Continue".`}]},
 {t:'cards',title:`Atcom: cancellation fee and consent`,sub:`What to do after you cancel.`,cards:[
  {i:`card`,h:`Add the cancellation fee`,p:`Tick the cancellation fee service line\nService > Manual Prices\nUse code "CANS" and apply the fee amount\nSelect "Update and Close to Continue"`},
  {i:`check`,h:`After cancelling`,p:`• Old amendment fees remain on the original booking\n• Check the unpaid balance and transfer funds if necessary\n• Add booking memos using the CAR template`},
  {i:`users`,h:`Consent: not the policyholder`,p:`Passengers who are not the policyholder can amend with the policyholder's consent. Confirm the policyholder has given permission before you proceed.`}]},
 {t:'cards',title:`Stop sale overrides`,sub:`Some can be overridden directly. Others need Commercial approval first.`,cards:[
  {i:`check`,h:`No approval: board change`,p:`Customer upgrades Half Board to Full Board.\nDo: override the stop sale directly.\nSay: "I've upgraded your board basis to Full Board. Your booking is confirmed and you'll receive an updated confirmation shortly."`},
  {i:`users`,h:`No approval: removing passengers`,p:`Family of 4 reduces to 2 adults, same room type.\nDo: remove the passengers and override the stop sale.\nSay: "I've removed the 2 passengers from your booking. Your room type remains the same and everything is confirmed."`},
  {i:`user`,h:`No approval: adding a passenger (within occupancy)`,p:`Couple adds 1 child to a room with a maximum occupancy of 3.\nDo: add the child and override the stop sale.\nSay: "I've added your child to the booking. The room accommodates up to 3 people, so this is all confirmed."`},
  {i:`alert`,h:`Approval needed: adding a room`,p:`Do: contact Commercial FIRST, then override after approval.\nSay: "I need to check availability with our Commercial team for the additional room. I'll contact them now and get back to you within [timeframe]."`},
  {i:`clock`,h:`Approval needed: changing travel dates`,p:`Do: contact Commercial FIRST for approval.\nSay: "I need to confirm availability for your new dates with our Commercial team. Let me check this for you and I'll update you shortly."`},
  {i:`star`,h:`Key points`,p:`• Split overrides evenly across passengers where possible\n• Use the correct codes (BPD, OLDR, PRII, HCMH)\n• Document everything clearly\n• Contact Commercial BEFORE overriding when required`}]},
 {t:'cards',title:`Price and voucher overrides`,sub:`What to do and what to say. Always add a CAR memo.`,cards:[
  {i:`tag`,h:`BPD: price difference after an amendment`,p:`Original £1,500, new price £1,265 (difference £235, 3 passengers).\nDo: apply £78.33 to 2 passengers and £78.34 to the lead passenger, with code BPD.\nSay: "I've applied a price adjustment of £235 to match your original booking cost. This has been split across all passengers and your total remains £1,500."`},
  {i:`card`,h:`OLDR: reapply a digital voucher`,p:`£100 voucher from a previous complaint, to reapply after an amendment.\nDo: code OLDR, enter the original booking reference in the reason text, apply the £100 discount.\nSay: "I've reapplied your £100 voucher to the booking. Your new total is [amount] and this is now confirmed."`},
  {i:`clock`,h:`HCMH: booking is cheaper after an amendment`,p:`Customer paid £2,000, the amended booking is £1,800.\nDo: apply HCMH and hold the £200 for 10 days while the customer decides on further changes.\nSay: "Your amended booking is £200 less than the original. I've held this amount for 10 days in case you want to make any other changes. After that, it will be automatically refunded to your original payment method."`},
  {i:`shield`,h:`Remove cancellation fees (TUI-led change)`,p:`Customer cancelling because of a TUI flight time change, with £500 cancellation fees.\nDo: Service > Manual Prices, split the £500 across all passengers and remove the fees with the appropriate code.\nSay: "As this cancellation is due to our flight change, I've removed all cancellation fees. You'll receive a full refund of £[amount] within 7-10 working days."`},
  {i:`trend`,h:`PRII: restore the original price`,p:`Original £1,200, the system shows £1,000 after an amendment.\nDo: code PRII, add £200 to the accommodation line and split across passengers.\nSay: "I've adjusted the price back to your original booking cost of £1,200. This ensures your holiday remains at the same price you originally paid."`}]},
 {t:'steps',title:`Promotional codes: apply and validate`,sub:`Applying a code in the booking system.`,steps:[
  {h:`Open Promotional Offer`,p:`Click the 3 dots at the bottom of the screen and select "Promotional Offer".`},
  {h:`Add a new offer`,p:`Click "New".`},
  {h:`Enter the code`,p:`Enter the promo code, click "Calculate", enter the discount amount, click "Update", then "Close".`},
  {h:`Find current codes`,p:`Use the system's promo code reference page.`},
  {h:`Validate the code`,p:`Check the discount still applies on the promo code terms and conditions page. The system calculates the discount when you enter the code.`},
  {h:`Expired code?`,p:`If it is an expired code (not found on the web), ask a Team Manager to check in Atcom.`}]},
 {t:'steps',title:`Promo code invalid after an amendment`,sub:`Holiday Change amendments within the same season.`,steps:[
  {h:`Try the original code first`,p:`Retrieve the booking, note the original promo code and try adding it back.`},
  {h:`If it will not reapply, use TRD`,p:`Use the TRD (Booking Adjustment) code. Calculate the original discount amount, divide it by the number of passengers, and apply TRD with the original discount value.`},
  {h:`Apply HCMH`,p:`Apply HCMH so the customer is not automatically refunded.`},
  {h:`Clean up`,p:`If the original code stays on but shows an incorrect value, remove it before adding TRD.`},
  {h:`Leave clear notes`,p:`Document the original promo code details and why you reapplied it.`},
  {h:`Tell the customer`,p:`"Due to the amendment to your booking, the original promotional code needs to be reapplied. I've ensured you still receive the same discount value of [amount] that was on your original booking. This has been applied using our booking adjustment process to maintain your original holiday cost."`}],note:`Building work changes: if the customer chooses their own alternative accommodation, they can use any new promo codes available when they rebook. The original code does not carry over. Different codes apply to different Holiday Change types: HCPA, HCPC, HCDC, HCDX.`},
 {t:'steps',title:`Adding a memo and the CAR template`,sub:`Add a booking memo after every customer interaction, ideally before the customer hangs up.`,steps:[
  {h:`Open the memos`,p:`On the booking overview page, click the "Memos" button at the top of the booking screen.`},
  {h:`New memo`,p:`Click "+New" (top right of the popup).`},
  {h:`Enter the code`,p:`First box: the first part (e.g. BO, BE, NLA, WTN). Second box: the second part (e.g. BEM, BEN, NLDA, WEN).`},
  {h:`Open the editor`,p:`Click the ">" arrow next to the first column, then the "Editor" button under your memo codes.`},
  {h:`Write the note`,p:`Type your note in the text box.`},
  {h:`Save and close`,p:`Press "Save", then "Close". Your note appears at the top of the memo list.`}],note:`CAR template (critical): whenever you use a code to adjust costings, adding OR removing, include C = Code used, A = Amount applied, R = Reason for use.`},
 {t:'cards',title:`Memo codes`,sub:`Which memo to use. The steps are on the previous page.`,cards:[
  {i:`file`,h:`BO / BEM`,p:`Standard booking memo. General customer interactions and conversations.`},
  {i:`clock`,h:`BE / BEN`,p:`Balance extension memo. Use when extending payment deadlines.`},
  {i:`shield`,h:`NLA / NLDA`,p:`Non-lead authorisation. Use for authorisations involving non-lead passengers.`},
  {i:`refresh`,h:`HC / HCN`,p:`Holiday Change memos.`},
  {i:`file`,h:`WTN / WEN`,p:`Alternative memo codes shown in training materials.`},
  {i:`star`,h:`QSM`,p:`Quick Service Memo. Notes on a specific service line (flight, accommodation) for special requests like birthdays or celebrations.`},
  {i:`list`,h:`Complex booking memo`,p:`For more detailed or complex booking situations.`},
  {i:`users`,h:`RETN`,p:`Retail Notes.`},
  {i:`book`,h:`REPT`,p:`Package Travel Regulations Notes.`},
  {i:`users`,h:`REBN`,p:`Retail Booking Notes.`},
  {i:`shield`,h:`REIN`,p:`Insurance Notes.`}]},
 {t:'cards',title:`Price and cost codes`,sub:`One-line meanings. The how-to is under Bookings and money.`,cards:[

 {t:'cards',title:`Who to contact: teams`,sub:`Which team handles what.`,cards:[
  {i:`star`,h:`Quality Monitoring Team`,p:`Enhances quality and performance in the Contact Centre. Listens to calls and gives feedback via Calabrio. Supports colleagues to reach their targets.`},
  {i:`refresh`,h:`Holiday Change (HC) Team`,p:`Handles holiday booking changes and amendments. Manages incidents like overbookings, room changes and facility losses. Works with resort and product teams for confirmations.`},
  {i:`file`,h:`After Travel Team`,p:`Post-holiday complaints and feedback. Issues not resolved within 28 days. Compensation queries (excluding flight delays). Includes the Detractor Team for customers who scored 0-3 on satisfaction surveys.\nContact via the Pre-Travel Form: https://forms.gle/ShT6DXW3rFK3g3Q972`},
  {i:`plane`,h:`3PF Team (Third Party Flights)`,p:`Manages 3PF and Dynamic Package bookings. Handles multicentre bookings without tours that use 3PF flights.`},
  {i:`globe`,h:`TUI Tours Team`,p:`Bookings that include named tours (e.g. Highlights of Kenya), multicentre bookings that include tours, and all TUI Tours After Travel complaints.\nContact: 0204 578 0994 or 0203 451 2688`},
  {i:`headset`,h:`TUI Tours Design Your Trip (Contact Centre of Excellence)`,p:`Supports bookings made on the new platform: navigation, booking issues, failed bookings, amendments and cancellations. Monday to Saturday, 9am to 5pm.\nPhone: 02038303212\nEmail: Tours.uk@tui.com`},
  {i:`heart`,h:`Assisted Travel Team`,p:`Supports customers with access needs and disabilities: airport assistance, mobility aids, medical equipment.\nContact: 0800 145 6920 (TUI Airways) or 0203 451 2688 (non-TUI flights)`},
  {i:`clock`,h:`24/7 Team (TUI Experience Centre)`,p:`24/7 in-resort support while customers are on holiday. Contactable via the TUI app at any time during the holiday.`},
  {i:`monitor`,h:`Digital Team`,p:`Handles digital customer interactions and processes. Can help with after-travel queries: complaint chasing, no show letters, APD refunds and compensation.`}]},
 {t:'cards',title:`Cancellation: worked examples`,sub:`The same method as the calculator. Refund assumes the customer paid in full.`,cards:[
  {i:`card`,h:`Example 1: 36 days before`,p:`Departure 10 September 2026. Cancelled 5 August 2026 (36 days before).\nHoliday price £4,500. £4,500 × 70% = £3,150 fee.\nRefund: £1,350.`},
  {i:`card`,h:`Example 2: 23 days before`,p:`Departure 20 June 2026. Cancelled 28 May 2026 (23 days before).\nHoliday price £2,800. £2,800 × 90% = £2,520 fee.\nRefund: £280.`}]}
]},
