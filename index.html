 {t:'drill',title:`GDPR scenarios (1)`,sub:`Caller, authorisation and third party problems. System steps use C4C and Atcom.`,lead:`Scenario`,items:[
  {q:`1. Caller says they are the lead passenger but is not. ("I'm calling about booking TUI123456." You ask who you are speaking to and they say John Smith, but the lead passenger is Sarah Smith.)`,a:`1. Open C4C in Chrome or Edge (not IE)\n2. Click "Customers" in the left-hand menu, then the magnifying glass icon (top right)\n3. Enter the booking reference "UK_TUI123456" and click "Execute Query"\n4. Go to the Booking View tab and check the "Lead Customer" field in the Overview section\n5. Compare the caller's name with the lead passenger's name\n6. If they do not match, open the "Involved Parties" tab and check for authorised non-leads\n7. Complete the 3 data point checks: Name, Departure Date, DOB\n8. If not authorised, politely explain you can only discuss the booking with the lead passenger or an authorised non-lead\n9. Click "Cases" > "Create Case" (top right), log the interaction in the case timeline and click Save\n10. Log the interaction in Atcom notes`,tip:`Never share booking details until the person is verified or authorised.`},
  {q:`2. Non-lead without authorisation. (A man calls about his wife's booking. He passes ID&V but is not listed as an authorised non-lead.)`,a:`1. Open C4C and search the booking: "Bookings" menu > "Active Bookings New" > enter the reference > "Go"\n2. Open the booking by clicking the Booking ID\n3. Go to the "Involved Parties" tab and check whether the caller is listed as an authorised non-lead\n4. If not listed, explain the authorisation requirement\n5. Advise the lead passenger must call to authorise him or add him as a non-lead\n6. Click "Cases" in the left menu, create a new case documenting the refusal, add notes in the "Notes" section and click Save\n7. Close the interaction without sharing any booking details`,tip:`Passing ID&V is not the same as being authorised on the booking.`},
  {q:`3. Third-party agent refuses GDPR. (A travel agent wants booking information but will not give GDPR details until you share the booking reference.)`,a:`1. Do NOT search for the booking in C4C yet\n2. Explain that GDPR verification must happen first\n3. Request: ABTA number, DOB of the lead passenger and phone number (3 data points for the 3PA)\n4. Only after verification, open C4C: "Bookings" > "Active Bookings New" > Advanced Search (funnel icon)\n5. Enter the booking reference and customer name, then click "Go"\n6. Open the booking and verify the details\n7. Provide the TUI reference, lead passenger name and departure date to the 3PA\n8. Click "Cases", create a case and log the GDPR completion in the timeline, then Save\n9. Proceed with the query`,tip:`Verification always comes before you search or share anything.`},
  {q:`4. Incorrect customer details. (The date of birth in the system is wrong, or the customer has legally changed their name since booking.)`,a:`1. Open C4C and click "Customers" in the left menu\n2. Use Advanced Search (funnel icon): customer name plus at least 1 other criterion, then "Go"\n3. Click the customer name to open Customer View\n4. Go to the "Contact Info" tab and check the DOB shown\n5. DOB amendment: click the "Edit" pencil icon, update the DOB field (follow the DOB amendment process in the guidance)\n6. Name change: follow the name change procedures\n7. Request supporting documentation if needed\n8. Click "Cases" > "Create Case" and select the "Request for Information" case type\n9. Add the amendment details in the "Notes" tab\n10. Open the "Attachments" tab and upload supporting documents when received, then Save\n11. Update Atcom with the amendment request details\n12. Advise the customer of timescales`,tip:`Create the case for the amendments team if the process requires it.`}]},
 {t:'drill',title:`GDPR scenarios (2)`,sub:`Unavailable lead passenger, cold transfers and missing dates.`,lead:`Scenario`,items:[
  {q:`5. Lead passenger unavailable. (The lead is in hospital, prison or serving offshore in the military, and there is no authorised non-lead.)`,a:`1. Verify the caller's relationship to the lead passenger\n2. Explain the standard procedure requirements\n3. Open C4C and search the booking in the "Bookings" menu, then verify the lead passenger details\n4. Click "Cases" > "Create Case" and select "Request for Information" (RFI) as the case type\n5. Add detailed notes explaining the situation in the "Notes" tab\n6. Request a signed Indemnity form\n7. Open the "Attachments" tab and upload the Indemnity form once received\n8. Assign or escalate the case to the appropriate team for approval, then Save\n9. Monitor the case status in the "My Open Cases" queue until resolved`,tip:`No authorised non-lead means no booking details until the Indemnity form is approved.`},
  {q:`6. Cold transfer with previous GDPR. (You receive a transferred call with notes saying "GDPR already passed.")`,a:`1. Ignore the previous GDPR notes\n2. Complete a fresh GDPR verification from scratch\n3. Ask: "Who am I speaking to today?"\n4. Open C4C and search the booking from the "Bookings" menu\n5. Verify 3 data points: Name, Departure Date, DOB\n6. Only proceed after verification is complete\n7. Open the existing case if one exists, go to the "Notes" tab, add the note "Second GDPR verification completed" with a timestamp, then Save\n8. Proceed with the query`,tip:`Never trust GDPR notes from another agent.`},
  {q:`7. Customer does not know the departure date. ("I'm travelling sometime in August but can't remember the exact date.")`,a:`1. Ask for the booking reference or the confirmation email\n2. If unavailable, ask for approximate travel dates\n3. Open C4C > "Customers" > Advanced Search (funnel icon), enter the lead passenger name and click "Go"\n4. Click the customer name to open Customer View\n5. Open the "BOOKINGS" tab and review all bookings for the customer\n6. Once identified, complete the remaining GDPR checks\n7. Confirm the exact departure date with the customer\n8. Proceed with the query`,tip:`Use the customer's bookings list to find the date, then still complete all checks.`}]},
 {t:'drill',title:`GDPR scenarios (3)`,sub:`Missing reference, multiple bookings and gift bookings.`,lead:`Scenario`,items:[
  {q:`8. Booking reference not available. ("I don't have my booking reference with me.")`,a:`1. Confirm they are the lead passenger\n2. Ask for the full name as it appears on the booking\n3. Request the departure date (day, month, year)\n4. Search C4C Customer View by name\n5. Open the "BOOKINGS" tab and filter by departure date\n6. Verify the DOB to complete 3 data points\n7. Proceed once the booking is identified`,tip:`Name plus departure date plus DOB can replace the reference.`},
  {q:`9. Multiple booking references. (The customer has several bookings and is not sure which one they are calling about.)`,a:`1. Search Customer View by the lead passenger name\n2. Go to the "BOOKINGS" tab and display all active bookings\n3. Read out the destinations and departure dates\n4. The customer confirms which booking\n5. Complete GDPR for that specific booking\n6. Navigate to that Booking View\n7. Proceed with the query`,tip:`Read out destinations and dates only, nothing more, until GDPR is complete for the chosen booking.`},
  {q:`10. Surprise booking. (Someone calls about a booking they did not make: it was a gift.)`,a:`1. Verify they are listed as the lead passenger\n2. Complete the standard 3 data point checks\n3. If they do not know the details, ask them to check the confirmation email\n4. Search the booking in C4C once verified\n5. Provide the booking details\n6. Update the contact information if needed in the "Contact Info" tab\n7. Proceed with the query`,tip:`Being the lead passenger is what counts, not who paid.`}]},
 {t:'cards',title:`C4C: what it is and what it does`,sub:`C4C is TUI's customer relationship management system.`,cards:[
  {i:`search`,h:`What you can do in C4C`,p:`• Search and view customer information\n• Access booking details\n• Create and manage cases\n• Send emails to customers\n• View customer history and preferences`},
  {i:`user`,h:`1. Customer management`,p:`• Search customers with advanced search (name, postcode, email, etc.)\n• View contact details and marketing preferences\n• Update customer information when needed`},
  {i:`file`,h:`2. Booking access`,p:`• Search bookings by reference number (use the UK_ prefix)\n• View travel dates, accommodation and customer information\n• Access @com directly through C4C`},
  {i:`list`,h:`3. Case handling`,p:`• Create new cases for customer queries\n• Search existing cases to avoid duplicates\n• Manage case status and add notes\n• Send email responses directly from cases`}]},
 {t:'steps',title:`C4C: getting started`,sub:`The four steps to find a customer and handle a case.`,steps:[
  {h:`Access C4C`,p:`Log in through Quick Links on Smile. Click into "Cases" then "Agent Desktop". Use Chrome or Edge, not IE.`},
  {h:`Search for the customer`,p:`Use advanced search with at least 2 pieces of information, click "Go", then select the customer name to open their record.`},
  {h:`Check for existing cases`,p:`Always check under both the customer AND bookings tabs. Verify the case status before creating a new one.`},
  {h:`Create a case if needed`,p:`Use the quick create button or the case tab. Link it to the correct customer or booking and complete the required fields.`}],note:`Tips: personalise your view on first login to show the right columns. Use the home icon to return to the main page. Refresh tabs after changes to see updates. Recent History shows your last 14 accessed items. For detailed case handling, see the Handling Pre-Travel C4C Cases PowerPoint.`},
 {t:'cards',title:`Quick case summary`,sub:`Use this to size up any call in a few seconds.`,cards:[
  {i:`chat`,h:`Customer's concern or issue`,p:`What is the customer calling about?`},
  {i:`clock`,h:`Departure date`,p:`When are they travelling?`},
  {i:`clock`,h:`Today's date`,p:`How many days to departure?`},
  {i:`plane`,h:`Booking type`,p:`Flight only, package, cruise, third party, etc.`},
  {i:`headset`,h:`How can I assist the customer?`,p:`Decide the next action and the right team or process.`}]},
 {t:'drill',title:`Insurance: how to ask`,sub:`Check whether the customer has insurance and point them to their insurer.`,lead:`Situation`,items:[
  {q:`Customer cancelling or cutting short a trip for an unforeseen reason`,a:`"Do you have travel insurance for your booking? If so, I'd recommend contacting your travel insurer to make a claim for this situation, as they handle cases like [illness/early departure/cancellation due to unforeseen events]."`,tip:`Only ask and direct them to their insurer. Do not confirm what the policy covers. Then note it under "Insurance?" in your call notes.`}]},
 {t:'steps',title:`Handling a cancellation request`,sub:`Six steps, from understanding the reason to the follow-up.`,steps:[
  {h:`Understand the reason`,p:`Ask what is prompting the cancellation, whether something specific has changed, and whether any concerns could be addressed.`},
  {h:`Review the booking`,p:`Recall the booking by reference number and check the customer details. Review any incident memos or Holiday Change notes for existing issues.`},
  {h:`Explore alternatives`,p:`A: modify the booking (dates, similar accommodation, flight timings). B: rebook a different holiday, with an incentive of up to 10% off the new booking if eligible. C: address the specific concern (follow the Flight Timing Change Policy for timing changes, review alternatives for hotel changes, address service issues).`},
  {h:`Explain the terms if they insist`,p:`Cancellation fees apply: £200 per person for Short Haul, £250 per person for Long Haul. The full deposit must be paid before cancelling. The refund is processed within 14 days, minus the fees. Confirm: full deposit paid, understands the fees, certain to proceed.`},
  {h:`Process the cancellation`,p:`Make sure the full deposit is paid (take payment if not). Click Cancel (bottom right of the booking), confirm the fee pop-up with YES, tick the reason, enter brief notes, tick the Confirmation box and click Proceed. Check any refund due on Booking Overview and add a booking memo.`},
  {h:`Follow up`,p:`Confirm the cancellation, explain the refund timeline, provide any documentation and make sure all notes are in the system.`}],note:`Third-party supplier bookings (airport parking, lounges, transfers, excursions) are not cancelled automatically. Cancel them separately with the suppliers. These per-person fees come from the Pre-Travel training notes. Check them against the percentage scale under Cancellation terms before quoting.`},
 {t:'drill',title:`Cancellation request: questions and key phrases`,sub:`What to ask and say at each stage. Be specific and avoid vague language.`,lead:`Stage`,items:[
  {q:`Step 1: understand the reason`,a:`"May I ask what's prompting you to consider cancelling your holiday?"\n"Has something specific changed that's affecting your travel plans?"\n"Are there any particular concerns about your booking that we might be able to address?"`,tip:`Ask one, then listen.`},
  {q:`Step 3: modify the existing booking`,a:`"Would changing your travel dates work better for you? We can look at alternative departure dates."\n"If the accommodation isn't quite right, we could explore similar alternatives in the same area."\n"For flight timing issues, we have flexibility to look at different options that might suit you better."`,tip:`Offer one alternative that fits their reason.`},
  {q:`Step 3: rebook a different holiday`,a:`"Instead of cancelling, would you like to explore rebooking to a different destination or date?"\n"We can look at what's available that might better suit your current circumstances."\n"You may be entitled to an incentive of up to 10% off your new booking, which could help with any price difference."`,tip:`Only mention the incentive if the customer is eligible.`},
  {q:`Step 4: explaining the terms`,a:`"I understand you'd like to proceed with the cancellation. Let me explain the terms:"\n"You'll need to have paid the full deposit before we can process the cancellation."\n"Once cancelled, we'll process your refund within 14 days, minus the applicable cancellation fees."`,tip:`Then confirm: "Have you paid the full deposit?", "Do you understand the cancellation fees that will apply?", "Are you certain you'd like to proceed?"`},
  {q:`Empathetic opening`,a:`"I'm sorry to hear you're considering cancelling your holiday. Let's see how we can help."`,tip:`Warm first, then discover.`},
  {q:`Exploring alternatives`,a:`"Before we proceed with cancellation, I'd like to explore some options that might work better for you."\n"We have several alternatives available that could address your concerns without needing to cancel."`,tip:`Try to save the sale before processing.`},
  {q:`If the customer insists on cancelling`,a:`"I understand this is your decision. Let me walk you through the cancellation process and what to expect."\n"I'll make sure this is processed correctly for you and explain the timeline for your refund."`,tip:`Respect the decision and stay clear.`},
  {q:`Avoiding vague language`,a:`Instead of "etc.": "This includes airport parking, lounge access, transfers, and any excursions you've booked."\nInstead of "and so on": "You'll receive a refund minus the cancellation fee of £200 per person for Short Haul flights."`,tip:`List the actual items.`}]},
 {t:'cards',title:`Pre-travel timeframes (1)`,sub:`Close of business, TUI Flex and balance payment.`,cards:[
  {i:`clock`,h:`Close of Business (COB)`,p:`Free changes and cancellations: by Contact Centre close on the day after booking.\nException: bookings within 14 days of departure, where cancellation charges apply.`},
  {i:`shield`,h:`TUI Flex: bookings up to 6 April 2025`,p:`Changes and cancellations: up to 28 days before departure.\nPurchase window: at time of booking and more than 90 days before departure.`},
  {i:`shield`,h:`TUI Flex: bookings from 7 April 2025`,p:`Amendments only: up to 28 days before departure.\nPurchase window: at time of booking and up to 90 days before departure.`},
  {i:`card`,h:`Balance payment: bookings from 23 June 2025`,p:`TUI flights with beach packages: 30 days before departure\nRiver cruises: 30 days before departure\nThird-party shorthaul flights: 30 days before departure\nThird-party longhaul flights: 84 days before departure`},
  {i:`card`,h:`Balance payment: bookings before 23 June 2025`,p:`Balance due 12 weeks (84 days) before departure.`}]},
 {t:`cards`,title:`Pre-travel timeframes (2)`,sub:`Extensions, vouchers and special cases.`,cards:[
  {i:`refresh`,h:`Balance extensions`,p:`Standard extension: up to 14 days after the original due date.\nExceptional circumstances: an additional 7 days (21 days in total).\nFinal deadline: 10 weeks (70 days) before travel.\nAutomatic cancellation: 63 days before travel if unpaid.`},
  {i:`tag`,h:`Holiday vouchers`,p:`Valid for 18 months from the date of issue.\nCannot be redeemed within 14 days of departure.\nFull payment required within 12 weeks of departure.`},
  {i:`clock`,h:`Last-minute bookings`,p:`Payment via Pay By Link: within 10 minutes from the email link click.`},
  {i:`heart`,h:`Wedding bookings`,p:`Contract return: within 7 days if not done in store.`},
  {i:`alert`,h:`Stamped bookings`,p:`Escalation required when more than 10 days have passed since the booking was stamped.`},
  {i:`user`,h:`Customer care exceptions`,p:`Proof required from 1 October 2025.`}]},
 {t:'steps',title:`Non-integrated refund`,sub:`Moving money out of a booking by hand. Do each payment separately.`,steps:[
  {h:`Check the balance`,p:`Make sure there is a balance unpaid (a minus).`},
  {h:`Open the payment`,p:`Go to Payment information > Booking > Payment.`},
  {h:`One payment at a time`,p:`Complete the process per payment. If there are 10 payments, do each one separately, 1 by 1.`},
  {h:`Change the view`,p:`Change the view to standard.`},
  {h:`Note the information`,p:`Copy all the information into a sticky note.`},
  {h:`Take the card details`,p:`Take the payment number, the expiry date and the APEX number (hover over the Visa payment).`},
  {h:`Function`,p:`Select "Function" at the top, then "Non int - Refund".`},
  {h:`Visa adjust`,p:`Select "Visa adjust".`},
  {h:`Payment number`,p:`Enter 000000 plus the last 4 digits ("pay last").`},
  {h:`Names`,p:`Enter the name of the cardholder and the name of the lead passenger.`},
  {h:`Expiry and APEX reference`,p:`Select the expiry date and the APEX reference number.`},
  {h:`Payment note and authorisation`,p:`Write on the payment note that you are transferring money to booking ref ***. A manager must authorise with their own username and password.`}]},
 {t:'steps',title:`Non-integrated payment`,sub:`Adding the transferred money to the other booking.`,steps:[
  {h:`Open the receiving booking`,p:`Open the booking you will add the payment to.`},
  {h:`Function`,p:`Select "Function" > "Non int - Payment".`},
  {h:`Same steps as the refund`,p:`Follow the same steps as the refund (card details, names, expiry date, APEX reference).`},
  {h:`Positive amount`,p:`The amount has to be a positive value.`},
  {h:`Payment note`,p:`Write on the payment note that you are transferring money from booking ref ***.`},
  {h:`No authorisation needed`,p:`No manager authorisation is needed for the payment side.`}]},
 {t:'cards',title:`Amendment fees, waivers and linked memos`,sub:`Codes and memos to use when moving a customer between bookings.`,cards:[
  {i:`card`,h:`AFEE: adding amendment fees`,p:`Click on the booking, "Manual Prices", and set the price based on the T&Cs table.`},
  {i:`tag`,h:`CANS: waiving fees`,p:`Use CANS and enter the amount you want to waive for the cancellation as a negative amount (with a minus).`},
  {i:`file`,h:`CRBK - OREF`,p:`Memo left on the NEW booking with the OLD reference number.`},
  {i:`file`,h:`CRBK - NREF`,p:`Memo left on the OLD booking with the NEW reference number.`},
  {i:`list`,h:`BO / BEM with CAR`,p:`Leave a BOBEM memo with the procedures you followed and the CAR template: Code, Amount, Reason.`}]},
 {t:'cards',title:`APEX: payment statuses`,sub:`What each status means and what can still be done.`,cards:[
  {i:`check`,h:`AUTHORISED`,p:`Transaction approved by the acquirer. Can be captured or cancelled.`},
  {i:`clock`,h:`CAPTURED`,p:`Queued for processing. Can still be cancelled.`},
  {i:`check`,h:`SETTLED`,p:`Successfully processed. Can now be refunded.`},
  {i:`refresh`,h:`REFUNDED`,p:`Successfully refunded. No further processing unless a partial refund.`},
  {i:`alert`,h:`FAILED`,p:`Rejected by APEX, or a processing error occurred.`},
  {i:`alert`,h:`DECLINED`,p:`Declined by the card issuer.`},
  {i:`x`,h:`CANCELLED`,p:`Cancelled. No further processing allowed.`},
  {i:`lock`,h:`3DS_REQUIRED`,p:`Enrolled for 3D Secure, awaiting customer authentication.`},
  {i:`lock`,h:`AUTHENTICATION_REQUIRED`,p:`Created, but awaiting customer authentication.`},
  {i:`clock`,h:`PENDING`,p:`Queued for processing.`},
  {i:`alert`,h:`CHARGEBACK`,p:`Charged back by the customer.`},
  {i:`shield`,h:`CHARGEBACK REVERSAL`,p:`Chargeback successfully defended and reversed.`}]},
 {t:'cards',title:`APEX: viewing response codes`,sub:`Where to find the codes behind a payment.`,cards:[
  {i:`search`,h:`Open the details`,p:`Find the transaction in APEX and click the three dots (...) at the end of the transaction row. This shows the card details, payment status and transaction codes.`},
  {i:`list`,h:`Other code categories`,p:`• Card Holder Name Validation\n• CVV Responses\n• AVS Responses\n• Error Codes\n• Processing Errors - Reason Codes`}]},
 {t:'cards',title:`Pre-Travel empowerment: when to use it`,sub:`Three situations only. Check the booking history first.`,cards:[
  {i:`file`,h:`1. Brochure or web inaccuracy`,p:`When: the customer finds misleading or incorrect information in the brochure or website description.\nExample: the website shows a transfer time of 30 minutes from one airport but does not say it is 2 hours from another.\nReason code: CCEB.`},
  {i:`alert`,h:`2. Service failure`,p:`When: issues outside your control that affect the customer experience.\nExamples: technical problems with the website, poor service from colleagues, call-back delays, payment issues, seating issues, unresolved issues.\nReason code: CCEE.`},
  {i:`refresh`,h:`3. Holiday Change: external admin costs`,p:`When: the customer paid extra costs because of a TUI-led holiday change.\nThis does NOT compensate for the holiday change itself, only the additional costs.\nExample: extra fees to rebook flights or accommodation because TUI changed the dates.\nReason code: CCEH.`}]},
 {t:'cards',title:`Pre-Travel empowerment: amounts and rules`,sub:`Maximum amounts are the same for all three situations.`,cards:[
  {i:`card`,h:`Advisor maximum`,p:`£100 per person (£200 per booking).`},
  {i:`star`,h:`Manager maximum`,p:`£300 per booking (or 10% for high-value bookings).`},
  {i:`search`,h:`Check the history first`,p:`Always check the booking history to make sure the issue has not already been resolved.`},
  {i:`chat`,h:`Statement to read`,p:`"I'd like to confirm you are happy that this complaint has now been fully resolved for you."`},
  {i:`tag`,h:`Promo codes`,p:`Use promo code CCEM with the reason code: CCEB (brochure/web), CCEE (service failure) or CCEH (holiday change costs).`},
  {i:`file`,h:`Memo`,p:`Add a full booking memo using the template.`}]},
 {t:'cards',title:`Internal teams: who handles what`,sub:`More teams Pre-Travel works with. The main contact details are under "Who to contact: teams".`,cards:[
  {i:`star`,h:`Directors Team`,p:`Escalated Pre-Travel cases that come through the Directors office.\nUrgent cases (press cases, within 14 days of departure).\nExceptional circumstances (large bookings, special events, King's Garden Party invitations).`},
  {i:`users`,h:`Pre-Flight Customer Logistics Team`,p:`Full name changes (requires unchecking customers) and flight-related logistics issues.\nContact via the Teams Channel (not email from 7 July 2025). 48-hour response time.\nTeam Managers escalate specific issues to them following set procedures.`},
  {i:`plane`,h:`Flight Trading Team`,p:`Operational and commercial responsibilities.\nRepackage requests, seat movements and holiday changes, cancellations and timing change incidents.`},
  {i:`globe`,h:`Musement / EAT Team (Experiences and Tours)`,p:`Extra Service upgrade issues, experience bookings and confirmations, refunds for missed Local Expert appointments.`},
  {i:`shield`,h:`Legal Team`,p:`Legal proceedings complaints and complex legal cases.`},
  {i:`frown`,h:`Detractor Team (within After Travel)`,p:`Reaches out to customers who scored 0-3 on post-holiday surveys. Handles missed callbacks. Notes go in Atcom and AWS.`},
  {i:`file`,h:`After Travel Team (extra detail)`,p:`Reviews customer feedback within 28 days. Compensation vouchers and BACS payments. Proactive complaints and incidents. Pre-Travel supports customers chasing After Travel or who missed their calls, and escalates with the Pre-Travel Form.`},
  {i:`heart`,h:`Team Leaders, Team Partners and HEN`,p:`Escalate urgent cases to Team Leaders and Team Partners for acknowledgement. HEN (Higher Escalation Network) is involved in urgent case escalations.`},
  {i:`headset`,h:`Contact Centre and TUI Retail colleagues`,p:`Pre-Travel supports them with various queries and processes.`},
  {i:`list`,h:`Key working relationships`,p:`• Committed allocation flights are handled directly or managed within Pre-Travel\n• 3PF flights and dynamic packages must be handled by the 3PF team\n• Tours bookings must be handled by the TUI Tours Team`}]}
]},

 {t:'cards',title:'Mindset & what good looks like',sub:'Know what you are aiming for on every call.',cards:[

  {i:'shield',h:'It is not personal',p:'Anger is aimed at the situation. Stay professional and it passes faster.'},

  const BANDS=[[70,1e9,0,'70 days or more before travel'],[63,69,.3,'69 to 63 days before travel'],[49,62,.5,'62 to 49 days before travel'],[29,48,.7,'48 to 29 days before travel'],[15,28,.9,'28 to 15 days before travel'],[0,14,1,'14 to 0 days before travel']];

    el.addEventListener('input',e=>{const c=e.target.dataset.c;if(!c)return;if(c==='d1'||c==='d2')doDate();else doCancel()});

  /* synonym groups: English + Arabic keywords that should lead to the same place */
  const GROUPS=[
   ['angry','anger','shout','yell','scream','rude','abusive','furious','swear','upset','frustrat','hostile','irate','غضبان','زعلان','عصبي','صريخ','بيصرخ','زعيق','بيزعق','شتيمه','شتم','معصب'],
   ['price','expensive','cheap','cost','discount','offer','pricey','afford','budget','deposit','instalment','fee','charge','غالي','غاليه','رخيص','ارخص','خصم','تكلفه','سعر','رسوم','فلوس'],
   ['cancel','refund','nonrefundable','الغاء','كانسل','الغي','استرجاع','ريفند','استرداد'],
   ['delay','cancelled','disruption','strike','storm','weather','missed','reschedule','تاخير','متاخر','اتاجلت','تاجيل','اتلغت','فاتتني','اضراب'],
   ['system','error','down','slow','lag','crash','outage','freeze','glitch','technical','loading','سيستم','واقع','بطيء','هنج','عطل','ايرور','خطا'],
   ['manager','supervisor','escalat','boss','team leader','مدير','سوبر','سوبرفايزر','تصعيد','مسؤول'],
   ['verify','verification','security','identity','authoris','third party','تحقق','فيرفاي','هويه','سكيوريتي'],
   ['payment','card','declined','paid','twice','duplicate','دفع','كارت','مرفوض','اتخصم','مكرر'],
   ['baggage','bag','luggage','suitcase','weight','lost','شنطه','شنط','امتعه','وزن','ضايعه','ضايع'],
   ['upsell','upgrade','extra','seat','legroom','meal','sell','add on','بيع','ابيع','اضافه','ترقيه','كرسي','وجبه','اكل'],
   ['think','later','partner','call back','callback','hesitat','هفكر','بعدين','اتصل','جوزي','مراتي','شريكي','افكر'],
   ['opening','greeting','welcome','intro','hello','افتح','فتح','بدايه','ترحيب','السلام','افتتاح'],
   ['closing','close','recap','summary','goodbye','wrap','اقفل','قفل','ختام','ملخص','انهاء'],
   ['unknown','know','transfer','hold','answer','مش عارف','تحويل','انتظار','استني'],
   ['complaint','complain','compensation','claim','شكوي','شكوى','تعويض','تظلم'],
   ['safe','safety','visa','passport','document','entry','جواز','سفر','تاشيره','تاشيرة','امان','سلامه'],
   ['medical','sick','illness','wheelchair','assistance','bereavement','doctor','mourning','مريض','عيان','وفاه','دكتور','مساعده','كرسي متحرك'],
   ['name','spelling','misspell','correction','اسم','تصحيح','غلط'],
   ['missing','showing','not found','booking','مش لاقي','مش ظاهر','حجز','مفقود'],
   ['practise','practice','roleplay','roulette','drill','test','تدريب','تمرين','اتدرب'],
   ['hotel','room','twin','double','suite','view','cot','facility','facilities','check in','check out','فندق','غرفه','اوضه','اوضة','سرير','اطلاله'],
   ['board','half board','full board','all inclusive','breakfast','meals included','self catering','وجبات','فطار','شامل','نص اقامه'],
   ['destination','country','map','landmark','spain','greece','turkey','dubai','egypt','uae','where','بلد','دوله','خريطه','اسبانيا','اليونان','تركيا','دبي','مصر','الامارات','معالم'],
   ['wait','waiting','hold','stall','moment','searching','looking up','buy time','time','انتظار','استني','لحظه','دقيقه','بدور','وقت'],
   ['notes','note','summary','wrap up','log','record','ملاحظات','نوتس','تسجيل'],
   ['balance','passport','documents','eticket','receipt','invoice','transfer','pickup','reminder','add traveller','رصيد','جواز','مستندات','ايصال','فاتوره','تذكير'],
   ['calculator','calculate','days','nights','date','cancellation','terms','حاسبه','حساب','ايام','ليالي','شروط','الغاء'],
   ['app','download','checklist','boarding','tui app','تطبيق','ابليكيشن','تحميل'],
   ['quality','gdpr','memo','abta','codes','bem','ben','nla','كواليتي','ابتا','كود','جي دي بي ار'],
   ['c4c','case','cases','involved parties','indemnity','rfi','gdpr','non lead','lead passenger','third party agent','3pa','كيس','كيسز'].map(x=>x),
  ['apex','status','settled','captured','chargeback','non integrated','non int','refund','payment','ابكس','استرداد'].map(x=>x),
  ['empowerment','ccem','cceb','ccee','cceh','compensation','brochure','service failure','تعويض'].map(x=>x),
  ['timeframe','cob','flex','balance extension','voucher','deadline','موعد','ديدلاين'].map(x=>x),
  ['atcom','amend','amendment','override','promo','promotional','memo','car','stop sale','admin fee','read back','direct debit','اتكوم','تعديل','ميمو'],
   ['seat','seats','sys','xleg','xspc','legroom','infant','كرسي','مقعد','رضيع'],
   ['team','teams','contact','phone','assisted','tours','after travel','فريق','تواصل','رقم'],
   ['paris','france','eiffel','louvre','disney','باريس','فرنسا'],
   ['rapport','small talk','conversation','starter','british','friendly','chat','رابور','كلام','ونس','محادثه','بريطاني','افتح كلام']
  ].map(g=>g.map(norm));

  /* index every searchable thing in the deck */
  const E=[];
  flat.forEach((f,si)=>{
    const d=f.d,sec=f.sec,secIdx=SECTIONS.indexOf(sec);
    const base={si,secIdx,secName:sec.name,slideTitle:d.title};
    const push=(ti,title,body,tip)=>{const o={...base,ti,title,body:body||'',tip:tip||'',key:d.title+'#'+ti};o.nt=norm(title);o.nb=norm(body);o.ntip=norm(tip);o.nc=norm(sec.name+' '+d.title);o.words=new Set((o.nt+' '+o.nb).split(' '));E.push(o)};
    push(-1,d.title,d.sub||'',(d.chips||[]).join(' '));
    if(d.t==='drill')d.items.forEach((it,i)=>push(i,it.q,it.a,it.tip));
    else if(d.t==='cards')d.cards.forEach((c,i)=>push(i,c.h,c.p));
    else if(d.t==='steps')d.steps.forEach((s,i)=>push(i,s.h,s.p));
    else if(d.t==='compare')d.rows.forEach((r,i)=>push(i,r[0],'Avoid: '+r[1]));
    else if(d.t==='dest')d.items.forEach((c,i)=>push(i,c.n+' '+c.ab+(c.full?' '+c.full:''),c.lm.join('. ')+'. '+c.talk+' '+(c.f||[]).join(' '),c.qs.join(' ')));
  });

  function lev(a,b){if(Math.abs(a.length-b.length)>1)return 9;const m=a.length,n=b.length;let p=[];for(let j=0;j<=n;j++)p[j]=j;for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
  function expand(t){const out=new Set();GROUPS.forEach(g=>{if(g.some(w=>w===t||(t.length>=3&&(w.startsWith(t)||(w.length>=3&&t.startsWith(w))))))g.forEach(w=>out.add(w))});out.delete(t);return [...out]}
  function fieldScore(e,w){let s=0;if(e.nt.includes(w)){s=6;if(e.nt.startsWith(w)||e.nt.includes(' '+w))s=8}
    if(e.nc.includes(w))s=Math.max(s,3);
    if(e.nb.includes(w))s=Math.max(s,e.nb.includes(' '+w)?2.5:2);
    if(e.ntip.includes(w))s=Math.max(s,1);
    return s}
  const tokensOf=q=>norm(q).split(' ').filter(t=>t.length>=2);
  function search(q){
    const toks=tokensOf(q);if(!toks.length)return [];
    const plans=toks.map(t=>({t,syn:expand(t)}));
    const res=[];
    E.forEach(e=>{
      let tot=0,hit=0;
      plans.forEach(p=>{
        let best=fieldScore(e,p.t);
        if(best===0)p.syn.forEach(w=>{best=Math.max(best,fieldScore(e,w)*0.7)});
        if(best===0&&p.t.length>=5&&/^[a-z]+$/.test(p.t)){for(const w of e.words){if(lev(p.t,w)<=1){best=1.5;break}}}
        if(best>0){hit++;tot+=best}
      });
      if(hit){const fr=hit/plans.length;res.push({e,score:tot*fr*fr})}
    });
    res.sort((a,b)=>b.score-a.score);
    return res.slice(0,30).map(r=>r.e);
  }

  let pins=[],recents=[];
  try{pins=JSON.parse(localStorage.getItem('tui-pins')||'[]');recents=JSON.parse(localStorage.getItem('tui-recent')||'[]')}catch(err){}
  const save=()=>{try{localStorage.setItem('tui-pins',JSON.stringify(pins));localStorage.setItem('tui-recent',JSON.stringify(recents))}catch(err){}};
  const byKey=k=>E.find(e=>e.key===k);
  const sIdx=t=>flat.findIndex(f=>f.d.title===t);

  const FLOW=[['Open','Inbound openings: the essentials'],['Verify','GDPR verification: green, red and retail'],['Discover','Discovery in action'],['Resolve','Changes before travel'],['Add value','The upsell formula'],['Confirm','Closing the call'],['Wrap up','Call notes: fill and copy']];
  const TILES=[['frown','Customer is angry','angry'],['tag','"Too expensive"','price'],['alert','Wants to cancel','cancel'],['clock','"I need to think"','think'],['users','Asks for a manager','manager'],['lock','Security check issue','verify'],['monitor','System slow or down','system'],['card','Payment problem','payment'],['plane','Delay or cancellation','delay'],['bag','Baggage','baggage'],['trend','Upsell ideas','upsell'],['phone','Opening a call','opening'],['book','I do not know the answer','unknown'],['file','Complaint or compensation','complaint'],['shield','Is it safe? Visa?','safety'],['heart','Medical or bereavement','medical'],['home','Hotel or room question','hotel'],['chat','Start a conversation','rapport'],['globe','Destination chat','destination'],['clock','Need a moment (stall)','moment']];

  function hl(s,toks){let o=esc(s);const t=toks.filter(x=>/^[a-z0-9]+$/.test(x)&&!['amp','lt','gt'].includes(x));if(t.length)o=o.replace(new RegExp('('+t.join('|')+')','ig'),'<mark>$1</mark>');return o}
  function rowHTML(e,toks){
    toks=toks||[];const s=SECTIONS[e.secIdx],isSlide=e.ti===-1;
    let sn=(e.body||'').replace(/\s+/g,' ');if(sn.length>118)sn=sn.slice(0,116)+'...';
    return `<button type="button" class="qrow" data-k="${e.key}" style="--acc:${s.acc};--soft:${s.soft}"><span class="dot">${ic(isSlide?'right':s.icon)}</span><span class="txt"><b>${hl(e.title,toks)}</b><small>${esc(e.secName)}${isSlide?' · slide':' › '+esc(e.slideTitle)}</small><em>${hl(sn,toks)}</em></span>${pins.includes(e.key)?`<span class="pn">${ic('star')}</span>`:''}</button>`}
  function homeHTML(){
    let h=`<div class="qh">Where are you in the call?</div><div class="flow">${FLOW.map((f,i)=>`<button type="button" class="fp" data-slide="${sIdx(f[1])}"><i>${i+1}</i>${f[0]}</button>`).join('')}</div>`;
    h+=`<div class="qh">What is happening right now?</div><div class="tiles">${TILES.map((t,i)=>{const c=SECTIONS[1+(i%8)];return `<button type="button" class="tile" data-q="${t[2]}" style="--acc:${c.acc};--soft:${c.soft}"><span class="dot">${ic(t[0])}</span><span>${esc(t[1])}</span></button>`}).join('')}</div>`;
    const pe=pins.map(byKey).filter(Boolean);
    if(pe.length)h+=`<div class="qh">Pinned</div>${pe.map(e=>rowHTML(e)).join('')}`;
    const re=recents.map(byKey).filter(Boolean).slice(0,5);
    if(re.length)h+=`<div class="qh">Recently opened</div>${re.map(e=>rowHTML(e)).join('')}`;
    h+=`<div class="qh">Browse sections</div><div class="flow">${SECTIONS.map(s=>`<button type="button" class="fp sec" style="--acc:${s.acc};--soft:${s.soft}" data-slide="${flat.findIndex(f=>f.sec===s)}">${ic(s.icon)}${esc(s.name)}</button>`).join('')}</div>`;
    return h}

  let tab='find';
  const tFind=document.getElementById('tFind'),tPin=document.getElementById('tPin');
  function syncTabs(){tFind.classList.toggle('on',tab==='find');tPin.classList.toggle('on',tab==='pin')}
  function syncPins(){document.querySelectorAll('.pin').forEach(b=>b.classList.toggle('on',pins.includes(b.dataset.key)));document.getElementById('pbadge').textContent=pins.length;document.getElementById('pinCount').textContent=pins.length}

  let rows=[],sel=-1,cur=[];
  function setSel(i){if(!rows.length)return;sel=(i+rows.length)%rows.length;rows.forEach((r,j)=>r.classList.toggle('sel',j===sel));rows[sel].scrollIntoView({block:'nearest'})}
  function render(){
    const q=qin.value.trim();
    if(tab==='pin'){const pe=pins.map(byKey).filter(Boolean);
      if(!pe.length){qbody.innerHTML=`<div class="empty">${ic('star')}<p>No pinned scripts yet</p><span>Tap the star on any script card to pin it. It will appear here for one-tap access.</span></div>`;rows=[];sel=-1;return}
      qbody.innerHTML=`<div class="qh">${pe.length} pinned</div>`+pe.map(e=>`<div class="prow">${rowHTML(e)}<button type="button" class="unpin" data-k="${e.key}" aria-label="Unpin">${ic('x')}</button></div>`).join('');
      rows=[...qbody.querySelectorAll('.qrow')];setSel(0);return}
    if(!q){qbody.innerHTML=homeHTML();rows=[];sel=-1;return}
    const toks=tokensOf(q);cur=search(q);
    if(!cur.length){qbody.innerHTML=`<div class="empty">${ic('search')}<p>No match for <b>${esc(q)}</b></p><span>Try one word: angry, price, cancel, delay, hotel, baggage. Or clear the box and tap a tile.</span></div>`;rows=[];sel=-1;return}
    qbody.innerHTML=`<div class="qh">${cur.length} result${cur.length>1?'s':''}</div>`+cur.map(e=>rowHTML(e,toks)).join('');
    rows=[...qbody.querySelectorAll('.qrow')];setSel(0);qbody.scrollTop=0}

  function targetsOf(si){const f=flat[si],d=f.d,el=f.el;
    if(d.t==='drill')return [...el.querySelectorAll('.dcard')];
    if(d.t==='cards')return [...el.querySelectorAll('.grid > .card')];
    if(d.t==='steps')return [...el.querySelectorAll('.step')];
    if(d.t==='compare')return [...el.querySelectorAll('.cmp-row')].slice(1);
    return []}
  function open(t){qf.classList.add('open');qf.setAttribute('aria-hidden','false');qin.value='';tab=t||'find';syncTabs();render();setTimeout(()=>{if(tab==='find')qin.focus()},60)}
  function close(){qf.classList.remove('open');qf.setAttribute('aria-hidden','true');qin.blur()}
  tFind.onclick=()=>{tab='find';syncTabs();render();qin.focus()};
  tPin.onclick=()=>{tab='pin';qin.value='';syncTabs();render()};
  document.addEventListener('pointerdown',()=>document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot')));
  function jump(e){
    if(!e)return;close();go(e.si);
    recents=[e.key,...recents.filter(k=>k!==e.key)].slice(0,8);save();
    if(e.ti>=0&&flat[e.si].d.t==='dest'&&flat[e.si].el.__sel){flat[e.si].el.__sel(e.ti)}
    if(e.ti>=0){setTimeout(()=>{document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));const t=targetsOf(e.si)[e.ti];if(!t)return;t.scrollIntoView({block:'center',behavior:'smooth'});t.classList.add('spot');if(t.classList.contains('dcard')){t.classList.add('open');labelOf(t)}},430)}
  }

  qin.addEventListener('input',()=>{if(tab==='pin'&&qin.value.trim()){tab='find';syncTabs()}render()});
  qbody.addEventListener('click',e=>{
    const u=e.target.closest('.unpin');if(u){const i=pins.indexOf(u.dataset.k);if(i>=0)pins.splice(i,1);save();syncPins();render();return}
    const r=e.target.closest('.qrow');if(r){jump(byKey(r.dataset.k));return}
    const t=e.target.closest('.tile');if(t){qin.value=t.dataset.q;render();qin.focus();return}
    const f=e.target.closest('.fp');if(f){close();go(+f.dataset.slide)}
  });
  document.getElementById('qfBack').onclick=close;
  document.getElementById('qfX').onclick=close;
  document.getElementById('qbtn').onclick=()=>open('find');
  document.getElementById('pbtn').onclick=()=>open('pin');
  const qh=document.getElementById('qfHero');if(qh)qh.onclick=()=>open('find');
  document.addEventListener('keydown',e=>{
    const isOpen=qf.classList.contains('open');
    if(!isOpen){if(e.key.toLowerCase()==='p'&&!e.ctrlKey&&!e.metaKey&&!e.target.matches('input,textarea')){e.preventDefault();open('pin');return}if((e.key==='/'&&!e.target.matches('input,textarea'))||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();open()}return}
    if(e.key==='Escape'){e.preventDefault();if(qin.value){qin.value='';render()}else close()}
    else if(e.key==='ArrowDown'){e.preventDefault();setSel(sel+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();setSel(sel-1)}
    else if(e.key==='Enter'&&rows[sel]){e.preventDefault();jump(byKey(rows[sel].dataset.k))}
  });

  /* pin button on every script card */
  flat.forEach((f,si)=>{if(f.d.t!=='drill')return;f.el.querySelectorAll('.dcard').forEach((c,ti)=>{
    const k=f.d.title+'#'+ti;const b=document.createElement('button');b.type='button';b.className='pin'+(pins.includes(k)?' on':'');b.dataset.key=k;b.title='Pin for quick access';b.setAttribute('aria-label','Pin this script');b.innerHTML=ic('star');c.appendChild(b)})});
  stage.addEventListener('click',e=>{const b=e.target.closest('.pin');if(!b)return;const k=b.dataset.key,i=pins.indexOf(k);if(i>=0)pins.splice(i,1);else pins.unshift(k);save();syncPins()});

  window.__qf={search,count:E.length};
  syncPins();
})();

/* init */
const h=parseInt((location.hash||'').replace('#',''),10);
go(Number.isFinite(h)&&h>=1&&h<=total?h-1:0);
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
