<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f7fb">
<title>TUI Pre-Travel Playbook</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6fed'/%3E%3Cpath d='M25.5 6.5 6.5 14l7.4 3 3 7.6z' fill='white'/%3E%3Cpath d='M13.9 17 25.5 6.5' stroke='%232f6fed' stroke-width='1.4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f7fb;--surface:#fff;--ink:#1c2a44;--muted:#66758f;--line:#e4eaf3;--brand:#2f6fed;--brand-soft:#e7efff;--good:#2e9d6a;--good-soft:#e3f6ec;--bad:#d4495a;--bad-soft:#ffecee;--shadow:0 1px 2px rgba(28,42,68,.04),0 10px 28px -14px rgba(28,42,68,.14);--r:16px;--ease:cubic-bezier(.22,.8,.3,1);--acc:#2f6fed;--soft:#e7efff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.5}
button{font-family:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:292px 1fr;height:100vh;height:100dvh}

/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -8px rgba(47,111,237,.7)}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav-list{flex:1;overflow-y:auto;padding:6px 12px 20px}
.grp{margin-bottom:2px;--acc:var(--brand);--soft:var(--brand-soft)}
.grp-h{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:12px;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;transition:background .3s ease}
.grp-h:hover{background:#f3f6fb}
.grp.active .grp-h{background:var(--soft)}
.grp-h .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--acc);transition:transform .4s var(--ease)}
.grp.active .dot{transform:scale(1.06)}
.grp-h .dot .ic{width:17px;height:17px}
.grp-h small{margin-left:auto;color:var(--muted);font-weight:500;font-size:11.5px}
.subl{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.grp.active .subl{grid-template-rows:1fr}
.subl ul{overflow:hidden;margin:0;padding:0 0 0 50px;list-style:none}
.subl li{padding:0}
.subl button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s,background .25s}
.subl button:hover{color:var(--ink);background:#f3f6fb}
.subl button.cur{color:var(--acc);font-weight:600}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(244,247,251,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:20}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:38px;height:38px;place-items:center;cursor:pointer;color:var(--ink)}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.top h1 span{color:var(--muted);font-weight:500}
.mode{margin-left:0;display:inline-flex;background:#e9eef6;border-radius:12px;padding:3px;position:relative}
.mode button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;position:relative;z-index:1;transition:color .3s;display:flex;align-items:center;gap:6px}
.mode button .ic{width:16px;height:16px}
.mode button.on{color:var(--brand)}
.mode .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:#fff;border-radius:9px;box-shadow:0 2px 8px -2px rgba(28,42,68,.18);transition:transform .45s var(--ease)}
body.practice .mode .pill{transform:translateX(100%)}
.prog{height:3px;background:#e4eaf3}
.prog i{display:block;height:100%;width:0;background:var(--brand);border-radius:0 3px 3px 0;transition:width .7s var(--ease)}

.stage{position:relative;flex:1;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(30px);transition:opacity .5s ease,transform .75s var(--ease),visibility 0s .75s;scroll-behavior:smooth}
.slide.before{transform:translateX(-30px)}
.slide.active{opacity:1;visibility:visible;transform:none;transition:opacity .55s ease,transform .75s var(--ease),visibility 0s}
.in{max-width:1080px;margin:0 auto;padding:32px 36px 120px}
.rise{opacity:0}
.slide.active .rise{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*55ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;border-radius:999px;background:var(--soft);color:var(--acc);font-weight:600;font-size:12.5px}
.chip .ic{width:15px;height:15px}
.sh-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
h2{margin:14px 0 8px;font-size:clamp(25px,3.1vw,36px);letter-spacing:-.025em;line-height:1.15}
.lede{margin:0 0 26px;color:var(--muted);max-width:700px;font-size:15.5px}
.sh{margin-bottom:6px}

.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--acc);transition:transform .25s var(--ease),filter .25s,background .25s}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn .ic{width:16px;height:16px}
.btn.solid{background:var(--brand);color:#fff;box-shadow:0 8px 18px -8px rgba(47,111,237,.6)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.sh .btn{margin-bottom:26px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .4s var(--ease),box-shadow .4s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(28,42,68,.04),0 18px 34px -16px rgba(28,42,68,.2)}
.card .ico{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;margin-bottom:12px}
.card h3{margin:0 0 5px;font-size:16px;letter-spacing:-.01em}
.card p{margin:0;color:var(--muted);font-size:14px}
.ph{background:#fff4d6;color:#8a6200;border-radius:5px;padding:0 4px;font-weight:500}

/* steps */
.steps{display:grid;gap:12px}
.step{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);transition:transform .4s var(--ease)}
.step:hover{transform:translateX(4px)}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.step h3{margin:1px 0 2px;font-size:15.5px}
.step p{margin:0;color:var(--muted);font-size:14px}
.note{margin-top:16px;padding:14px 18px;border-radius:14px;background:var(--soft);color:var(--ink);font-size:14px;display:flex;gap:12px;align-items:flex-start}
.note .ic{color:var(--acc);margin-top:2px}

/* drill cards */
.dcard{display:flex;flex-direction:column;gap:10px}
.lead{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.q{margin:0;font-size:15.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.dcard .rv{align-self:flex-start}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.ans>div{overflow:hidden;min-height:0}
body.study .dcard .ans,.dcard.open .ans{grid-template-rows:1fr}
.say{display:flex;gap:12px;padding:14px;border-radius:13px;background:var(--soft);font-size:14.5px;margin-top:2px}
.say .ic{color:var(--acc);margin-top:2px}
.tip{display:flex;gap:10px;margin-top:10px;font-size:13px;color:var(--muted);padding:0 4px}
.tip .ic{width:16px;height:16px;color:#d9a21b;margin-top:2px}
body.study .rv,body.study .revall{display:none}
.dcard .ans .say,.dcard .ans .tip{opacity:0;transform:translateY(6px);transition:opacity .5s ease .1s,transform .6s var(--ease) .1s}
body.study .dcard .ans .say,body.study .dcard .ans .tip,.dcard.open .ans .say,.dcard.open .ans .tip{opacity:1;transform:none}

/* compare */
.cmp{display:grid;gap:12px}
.cmp-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{padding:14px 16px;border-radius:14px;font-size:14.5px;border:1px solid transparent}
.cell.g{background:var(--good-soft);border-color:#cdeedb}
.cell.b{background:var(--bad-soft);border-color:#fad6db}
.cmp-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.cmp-h.g{color:var(--good)}.cmp-h.b{color:var(--bad)}

/* hero */
.hero{min-height:100%;display:grid;place-items:center;position:relative;overflow:hidden;padding:40px 24px 120px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 14s ease-in-out infinite}
.b1{width:380px;height:380px;background:#cfe0ff;top:-90px;left:-70px}
.b2{width:340px;height:340px;background:#d6f3ec;bottom:-80px;right:-60px;animation-delay:-5s}
.b3{width:260px;height:260px;background:#ffe9d3;top:35%;right:20%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-22px)}}
.hero-in{position:relative;text-align:center;max-width:760px}
.hero .big{width:78px;height:78px;border-radius:24px;background:var(--brand);color:#fff;display:grid;place-items:center;margin:0 auto 26px;box-shadow:0 18px 36px -14px rgba(47,111,237,.7)}
.hero .big .ic{width:38px;height:38px;stroke-width:1.6}
.hero h2{font-size:clamp(32px,5vw,54px);margin:0 0 14px}
.hero .lede{margin:0 auto 24px;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.chips span{background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);box-shadow:var(--shadow)}

/* lab */
.lab{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.scn h3{margin:8px 0 14px;font-size:21px;letter-spacing:-.015em}
.kv{display:grid;gap:12px;margin-bottom:18px}
.kv div b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.kv div span{font-size:14.5px}
.lvl{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.lvl.easy{background:var(--good-soft);color:var(--good)}.lvl.med{background:#fff2d9;color:#c98a12}.lvl.hard{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;letter-spacing:-.02em;margin-right:6px}
.pop{animation:pop .55s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.checks{display:grid;gap:4px;margin:6px 0 14px}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px;cursor:pointer;transition:background .25s}
.checks label:hover{background:#f3f6fb}
.checks input{appearance:none;width:20px;height:20px;border-radius:7px;border:1.6px solid #c4cee0;display:grid;place-items:center;transition:all .3s var(--ease);flex:none;cursor:pointer;background:#fff}
.checks input:checked{background:var(--acc);border-color:var(--acc)}
.checks input::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);margin-top:-2px;transition:transform .3s var(--ease)}
.checks input:checked::after{transform:rotate(-45deg) scale(1)}
.score{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;position:relative;flex:none}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .t{stroke:#e9eef6}
.ring .p{stroke:var(--acc);stroke-dasharray:264;stroke-dashoffset:264;transition:stroke-dashoffset .8s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.score p{margin:0;font-size:14px;color:var(--muted)}
.score p strong{display:block;color:var(--ink);font-size:16px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchips button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .3s var(--ease)}
.fchips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.rq{font-size:clamp(19px,2.3vw,26px);font-weight:600;letter-spacing:-.02em;margin:8px 0 18px;line-height:1.3}
.cnt{margin-left:auto;font-size:13px;color:var(--muted)}

/* bottom nav */
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:16px;pointer-events:none;z-index:15}
.dock-in{pointer-events:auto;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:0 14px 34px -14px rgba(28,42,68,.3)}
.dock button{width:42px;height:42px;border-radius:11px;border:0;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),opacity .3s}
.dock button:hover:not(:disabled){transform:scale(1.07)}
.dock button:disabled{opacity:.35;cursor:default}
.dock .cn{min-width:92px;text-align:center;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}
.dock .cn small{display:block;font-weight:500;color:var(--muted);font-size:11px;line-height:1.1}

.scrim{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .5s var(--ease);box-shadow:0 0 50px rgba(28,42,68,.25)}
 body.menu-open .side{transform:none}
 .scrim{display:block;position:fixed;inset:0;background:rgba(28,42,68,.28);opacity:0;pointer-events:none;transition:opacity .4s;z-index:25}
 body.menu-open .scrim{opacity:1;pointer-events:auto}
 .menu-btn{display:grid}
 .top{padding:10px 14px}
 .top h1 span{display:none}
 .in{padding:24px 18px 120px}
 .lab{grid-template-columns:1fr}
 .cmp-row{grid-template-columns:1fr}
 .mode button{padding:7px 10px}
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition-duration:.01ms!important}
 .rise{opacity:1}
}
/* quick find */
.qbtn{margin-left:auto;display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s,color .25s,border-color .25s}
.qbtn:hover{color:var(--brand);border-color:#c9d9fb;box-shadow:var(--shadow);transform:translateY(-1px)}
.qbtn .ic{width:16px;height:16px}
.qbtn kbd,.qf-foot kbd{font:600 11px Inter,system-ui,sans-serif;background:#eef2f8;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted)}
.qf{position:fixed;inset:0;z-index:60;display:grid;place-items:start center;padding:7vh 16px 16px;visibility:hidden;pointer-events:none;transition:visibility 0s .4s}
.qf.open{visibility:visible;pointer-events:auto;transition:visibility 0s}
.qf-back{position:absolute;inset:0;background:rgba(28,42,68,.32);backdrop-filter:blur(4px);opacity:0;transition:opacity .4s ease}
.qf.open .qf-back{opacity:1}
.qf-panel{position:relative;width:min(780px,100%);max-height:84vh;display:flex;flex-direction:column;background:#fff;border-radius:22px;box-shadow:0 30px 80px -20px rgba(28,42,68,.45);transform:translateY(-16px) scale(.98);opacity:0;transition:transform .55s var(--ease),opacity .4s ease}
.qf.open .qf-panel{transform:none;opacity:1}
.qf-bar{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--brand)}
.qf-bar input{flex:1;min-width:0;border:0;outline:0;font:500 17px Inter,system-ui,sans-serif;background:transparent;color:var(--ink)}
.qf-bar input::placeholder{color:#9aa7bd;font-weight:400}
.qx{border:0;background:#f1f4f9;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:pointer;transition:background .25s}
.qx:hover{background:#e6ebf4}
.qf-body{overflow-y:auto;padding:6px 16px 12px;min-height:120px}
.qf-foot{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.qf-foot span{display:inline-flex;gap:5px;align-items:center}
.qh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:16px 4px 9px}
.flow{display:flex;gap:8px;flex-wrap:wrap}
.fp{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;padding:8px 13px 8px 9px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);transition:transform .3s var(--ease),border-color .25s,background .25s}
.fp:hover{transform:translateY(-2px);border-color:var(--acc,var(--brand));background:var(--soft,var(--brand-soft))}
.fp i{font-style:normal;width:21px;height:21px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700}
.fp.sec{padding:8px 13px}
.fp.sec .ic{width:16px;height:16px;color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--acc)}
.tile .dot,.qrow .dot{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--acc);display:grid;place-items:center;flex:none}
.tile .dot .ic,.qrow .dot .ic{width:18px;height:18px}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:13px;cursor:pointer;color:var(--ink);transition:background .2s}
.qrow.sel,.qrow:hover{background:var(--soft)}
.qrow .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.qrow b{font-size:14.5px;letter-spacing:-.01em}
.qrow small{font-size:12px;color:var(--acc);font-weight:600}
.qrow em{font-style:normal;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .pn{color:#e0a21b}
.qrow .pn .ic{width:16px;height:16px;fill:currentColor}
mark{background:#fff0b8;color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .ic{width:30px;height:30px;color:#b6c1d4;margin-bottom:8px}
.empty p{margin:0 0 4px;color:var(--ink)}
.empty span{font-size:13px}
.dcard{position:relative}
.dcard .q{padding-right:30px}
.pin{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:#b3bdcf;display:grid;place-items:center;cursor:pointer;transition:background .25s,color .25s,transform .3s var(--ease)}
.pin:hover{background:var(--soft);color:var(--acc);transform:scale(1.08)}
.pin.on{color:#e0a21b}
.pin.on .ic{fill:currentColor}
.pin .ic{width:18px;height:18px}
/* highlight for the result you opened from search */
.spot{position:relative;outline:3px solid var(--acc);outline-offset:3px;background:var(--soft)!important;animation:spotpulse 1.1s ease 3}
.spot::before{content:"You are here";position:absolute;top:-12px;left:16px;background:var(--acc);color:#fff;font:700 11px Inter,system-ui,sans-serif;letter-spacing:.04em;padding:3px 10px;border-radius:999px;z-index:2}
@keyframes spotpulse{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 12px rgba(47,111,237,.22)}}
/* pinned button and tabs */
.pbtn{margin-left:0}
.pbtn .ic{color:#e0a21b;fill:#e0a21b}
.pbtn b{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.qtabs{display:flex;gap:6px;padding:10px 16px 0}
.qtabs button{border:0;background:#f1f4f9;color:var(--muted);font:600 13px Inter,system-ui,sans-serif;padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.qtabs button.on{background:var(--brand-soft);color:var(--brand)}
.qtabs b{background:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.prow{display:flex;align-items:center;gap:4px}
.prow .qrow{flex:1}
.unpin{border:0;background:#f1f4f9;border-radius:10px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none}
.unpin:hover{background:var(--bad-soft);color:var(--bad)}
.unpin .ic{width:15px;height:15px}
@media (max-width:600px){.qbtn .lbl,.qbtn kbd{display:none}.qf{padding-top:3vh}.qf-foot{display:none}.tiles{grid-template-columns:1fr 1fr}}
</style>
