<script>
/* ---------- helpers ---------- */
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>').replace(/\n/g,'<br>');

/* ---------- content ---------- */
const SECTIONS=[
{id:'start',name:'Start here',icon:'home',acc:'#2f6fed',soft:'#e7efff',slides:[
 {t:'hero',title:'TUI Pre-Travel Playbook',sub:'Everything before the trip: hotel and room questions, flight extras, special requests, rapport, objections and difficult calls. Ready-to-use English scripts you can practise out loud.',chips:['Quick find (press /)','Pinned (press P)','Study mode','Practice mode','Roleplay generator','Objection roulette']},
 {t:'cards',title:'How to use this deck',sub:'Two ways to work. Learn first, then switch to Practice and test yourself.',cards:[
  {i:'book',h:'Study mode',p:'Every response is visible. Read the script, notice the structure, copy the phrases you like.'},
  {i:'mic',h:'Practice mode',p:'Responses are hidden. Say your own answer out loud first, then reveal the model response and compare.'},
  {i:'shuffle',h:'Practice lab',p:'The last section has a random roleplay generator with timer and scorecard, plus an objection roulette.'},
  {i:'search',h:'Quick find (press /)',p:'Search anything, or tap a situation tile like "angry" or "hotel". Arabic keywords work too. Pin your favourite scripts with the star and open them from the Pinned button (or press P).'},
  {i:'file',h:'Make it yours',p:'Replace [Name], [X] and other highlighted placeholders. Always follow your account\'s approved wording, policies and compliance rules. These are templates, not official policy.'}]},
 {t:'cards',title:'What customers expect when they call',sub:'Keep these six expectations in your head before every call and very little will surprise you.',cards:[
  {i:'search',h:'Clarity',p:'"Tell me exactly what is happening and what happens next."'},
  {i:'clock',h:'Speed',p:'"Don\'t waste my time." They may already have waited in the queue.'},
  {i:'user',h:'Ownership',p:'"Don\'t pass me around." Be the person who fixes it, or who hands over properly.'},
  {i:'shield',h:'Honesty',p:'If you can\'t do something, say so and immediately offer the next best option.'},
  {i:'heart',h:'Empathy',p:'A holiday is emotional and expensive. Acknowledge that before you solve anything.'},
  {i:'star',h:'Value',p:'Help them feel they made a smart decision by calling and booking with TUI.'}]},
 {t:'steps',title:'The 7-step call framework',sub:'Every call, every scenario, the same backbone. Scripts in this deck slot into these steps.',steps:[
  {h:'Open & welcome',p:'Warm greeting, your name, positive energy. Let the customer speak.'},
  {h:'Verify',p:'Complete the security check before discussing any booking details.'},
  {h:'Discover',p:'Ask open questions, listen, paraphrase back to confirm you understood.'},
  {h:'Resolve or recommend',p:'Give clear options, best first. Do not just give information, guide the decision.'},
  {h:'Add value',p:'A natural upsell or cross-sell that is linked to what they told you.'},
  {h:'Confirm',p:'Recap actions, costs, timelines and anything you promised.'},
  {h:'Close & wrap up',p:'Offer further help, thank them, and write clear notes straight away.'}]}
]},

{id:'open',name:'Opening the call',icon:'phone',acc:'#1a9c8b',soft:'#def4f0',slides:[
 {t:'cards',title:'Voice & tone: the first 10 seconds',sub:'The opening sets the mood for the entire call. Get the delivery right and the script almost does itself.',cards:[
  {i:'smile',h:'Smile before you speak',p:'Customers genuinely hear it. Smile on the greeting every time.'},
  {i:'mic',h:'Pace & volume',p:'Slightly slower and calmer than your natural speed, especially with stressed customers.'},
  {i:'user',h:'Use their name',p:'Two or three times in the call, naturally. Never in every sentence.'},
  {i:'chat',h:'Let them finish',p:'Do not interrupt in the first 30 seconds. Let the story out, then summarise it back.'},
  {i:'clock',h:'Silence is fine',p:'A one-second pause while you type is better than filler words.'},
  {i:'heart',h:'Sound human',p:'Use the script as a skeleton. Your tone is what makes it sound like you.'}]},
 {t:'drill',title:'Inbound openings: the essentials',sub:'Four openings for the most common starts. Practise each until it sounds natural.',lead:'Situation',items:[
  {q:'Standard opening, neutral customer',a:'"Thank you for calling TUI, you\'re speaking with [Name]. How can I help you today?"',tip:'Clear, calm, and it ends with an open question.'},
  {q:'Customer sounds relaxed and chatty',a:'"Hi there, thanks for calling TUI, this is [Name]. What can I do for you today?"',tip:'A slightly lighter version. Match their energy, then lead it.'},
  {q:'Peak time and the customer waited a long while',a:'"Thank you for calling TUI, and thank you for your patience. I know the wait was longer than we\'d like. I\'m [Name], and I\'ll take good care of you. What can I help with?"',tip:'Acknowledge the wait once, briefly. Don\'t over-apologise.'},
  {q:'Customer opens with: "Finally! I\'ve been on hold for ages!"',a:'"I\'m sorry about the wait, that\'s not the experience we want you to have. I\'m [Name], and I\'m going to help you from here. Can I take your name and what\'s happened?"',tip:'Apologise, take ownership, move straight to the problem.'}]},
 {t:'drill',title:'Opening: tricky starts',sub:'When the call does not begin the textbook way.',lead:'Situation',items:[
  {q:'Returning caller: "I called yesterday and nothing happened."',a:'"Thanks for calling back, and I\'m sorry you\'ve had to chase this. Let me look at the notes from your last call so you don\'t have to repeat everything. May I take your name and booking reference?"',tip:'Show that you will read the history. Customers hate repeating themselves.'},
  {q:'Customer starts talking before you finish the greeting',a:'(Let them finish.) "Thank you for explaining. I\'m [Name], and I\'ll sort that out for you. First, may I take your name, please?"',tip:'Never talk over them. Listen, then re-introduce yourself.'},
  {q:'Call was transferred from another team',a:'"Thank you for holding, my name is [Name]. I understand you\'re calling about [issue], so you won\'t need to repeat it. Let me just confirm a couple of details."',tip:'Show you already have context.'},
  {q:'Quiet, unsure customer who hesitates after the greeting',a:'"Take your time, there\'s no rush at all. Whenever you\'re ready, just tell me what\'s on your mind and we\'ll work through it together."',tip:'Reduce pressure. Slow down your pace and soften your tone.'}]},
 {t:'drill',title:'Outbound, sales and routing',sub:'Callbacks, new-booking callers, wrong department, and hard-to-hear lines.',lead:'Situation',items:[
  {q:'Outbound or callback: you are calling the customer',a:'"Good morning, may I speak to [Mr/Ms Surname]? ... My name is [Name], calling from TUI about [booking / your callback request]. Is now a good time for a quick chat?"',tip:'Always ask permission to continue. Confirm identity before sharing details.'},
  {q:'Customer says: "I want to book a holiday / flight."',a:'"Wonderful, let\'s get you away! Do you already have a destination in mind, or shall I help you narrow it down?"',tip:'Energy up. You are now in discovery mode.'},
  {q:'Customer reached the wrong department',a:'"No problem at all, I\'ll make sure you reach the right team. So you don\'t have to repeat yourself, may I ask briefly what it\'s about?"',tip:'Warm-transfer with a short handover. Never just drop them.'},
  {q:'Poor line or language barrier',a:'"I want to make sure I hear you properly, so I\'ll speak slowly and clearly. If the line cuts out, I\'ll call you back on this number. Is that okay?"',tip:'Short sentences. Repeat key details back (names, dates, numbers).'}]}
]},

{id:'disc',name:'Verify & discover',icon:'lock',acc:'#6a52d9',soft:'#ece8ff',slides:[
 {t:'drill',title:'Security verification',sub:'Verify first, every time. Always use your account\'s exact approved checks.',lead:'Situation',items:[
  {q:'Standard security check',a:'"Before I access the booking, I need to complete a quick security check. Could I take the lead passenger\'s full name, the booking reference, and [date of birth / email / postcode, whichever your process requires]?"',tip:'Say why: it protects their booking and data.'},
  {q:'Customer pushes back: "Why do you need all this? You already have my details."',a:'"I completely understand, and thank you for your patience. It\'s there to protect your booking and your personal information. It only takes a moment."',tip:'Calm, brief, no apology for the policy. Keep going.'},
  {q:'Caller is a friend or partner, not the lead passenger',a:'"I\'m sorry, I can only discuss the booking with the lead passenger or someone authorised on it. If [name] is with you, I can speak to them briefly to get permission. Otherwise, they\'re welcome to call us directly."',tip:'Follow your account\'s third-party authority process exactly.'},
  {q:'Customer has no booking reference',a:'"No problem, I can try to find it another way. Could I have the lead passenger\'s name, travel date, and the email address used for the booking?"',tip:'Offer an alternative route before telling them you can\'t help.'}]},
 {t:'drill',title:'Verification: edge cases',sub:'The awkward ones that trip people up.',lead:'Situation',items:[
  {q:'Customer fails the security check',a:'"I\'m sorry, I\'m not able to go any further without completing the checks. It\'s to keep your details safe. If you can find [the confirmation email / the right details], call us back and we\'ll gladly help."',tip:'Firm and kind. Never give hints about the correct answers.'},
  {q:'Booking was made through a travel agent',a:'"Since this was booked through [agent], they manage the booking on your behalf. I\'d recommend contacting them directly. In the meantime, I\'m happy to check what I can see on our side."',tip:'Policy-dependent. Check what you are permitted to do on agent bookings.'},
  {q:'Adult child calling for an elderly parent',a:'"Thank you for helping your [mum/dad]. I\'ll need them to give us permission first. Is [name] with you? I can speak to them briefly for authorisation, then I\'m happy to help."',tip:'Be patient and respectful. Offer a way forward, never a flat no.'},
  {q:'Customer wants to change phone or email details',a:'"Of course. Once the security check is complete, I\'ll update that. Could you confirm the new [email / number], and I\'ll read it back to you to be sure it\'s right."',tip:'Always read contact details back letter-by-letter or digit-by-digit.'}]},
 {t:'cards',title:'Discovery questions that sell and solve',sub:'Great upselling and great service both start with great questions. Ask one at a time, then listen.',cards:[
  {i:'users',h:'Who is travelling?',p:'"Who\'s joining you? Any children or infants?"'},
  {i:'globe',h:'Where & when?',p:'"Where are you thinking of going, and when? Are your dates flexible?"'},
  {i:'target',h:'What matters most?',p:'"What\'s most important to you: price, comfort, convenience?"'},
  {i:'heart',h:'Special occasion?',p:'"Is this for anything special, like a birthday or honeymoon?"'},
  {i:'bag',h:'Luggage & extras',p:'"Will you need hold luggage? Any seat or meal preferences?"'},
  {i:'tag',h:'Budget',p:'"Do you have a budget in mind so I can find the best fit?"'}]},
 {t:'drill',title:'Discovery in action',sub:'Turn vague requests into clear needs.',lead:'Customer says',items:[
  {q:'"I just want the cheapest flight."',a:'"Absolutely, I\'ll find you the best value. Are your dates flexible by a day or two? That can often bring the price down. And will you need any hold luggage?"',tip:'Cheapest is rarely the only goal. Probe flexibility and extras.'},
  {q:'"I don\'t know where to go, I just want some sun."',a:'"Lovely! Let me ask a few quick questions: how long are you away, who\'s travelling, and what kind of break do you want, relaxing by the pool or lots to do?"',tip:'Narrow down with two or three questions, then recommend.'},
  {q:'"I just need to change something small."',a:'"No problem. Can you tell me exactly what you\'d like to change: the date, a name, or something else? I\'ll check what\'s possible and any costs involved."',tip:'"Small" changes can have fees. Clarify exactly what, then check rules.'},
  {q:'"I\'m booking for a big group, about 12 of us."',a:'"That sounds like a great trip! Is it a special occasion? Are you all travelling together, from the same airport? Group bookings may have different terms, so let me check the best way to set this up."',tip:'Groups often have special rules. Check before you promise.'}]}
]},

{id:'sell',name:'Sell & upsell',icon:'trend',acc:'#2e9d6a',soft:'#e1f5ea',slides:[
 {t:'cards',title:'Mindset: sell by solving',sub:'Great upselling feels like good advice, not pressure. If it does not help the customer, do not offer it.',cards:[
  {i:'search',h:'Listen first',p:'The best upsell is hidden in what they already told you: kids, a long stay, a special occasion.'},
  {i:'link',h:'Link to their need',p:'Say "because you mentioned...", then offer the add-on that fixes their concern.'},
  {i:'tag',h:'Price in small units',p:'Break it down: per person, per flight, or per day. "Just £[X] each way" lands softer than a big total.'},
  {i:'check',h:'Respect the "no"',p:'Offer once, clearly. If they decline, say "No problem at all" and move on. Never repeat the same pitch.'}].map(c=>c.i==='link'?{...c,i:'target'}:c)},
 {t:'steps',title:'The upsell formula',sub:'Five moves you can use for any add-on.',steps:[
  {h:'Need',p:'Find the reason through discovery. "You mentioned two young children..."'},
  {h:'Link the benefit',p:'"...so seats together mean you can sit beside them and relax."'},
  {h:'Price it simply',p:'"It\'s £[X] per seat each way, so £[total] for the family."'},
  {h:'Soft close',p:'"Would you like me to add that for you?" or "Shall I go ahead and reserve those?"'},
  {h:'Graceful exit',p:'If no: "Of course, no problem. You can always add it later via [Manage My Booking / by calling us]."'}],note:'Rule of thumb: one clear offer, one reason, one price, one question.'},
 {t:'drill',title:'Upsell: seats, legroom, bags, meals',sub:'The most common add-ons on flight bookings.',lead:'Situation',items:[
  {q:'Family with children booked flight-only, no seats chosen',a:'"Since you\'re travelling with two children, would you like me to reserve seats together? That way you can sit side by side with no worry at the airport. It\'s £[X] per seat each way, and it\'s something most families tell us they\'re glad they sorted."',tip:'The need (kids) is theirs. The solution is yours.'},
  {q:'Tall customer, or a long-haul flight',a:'"For a flight that long, would extra legroom be worth considering? It\'s £[X] per person each way and makes a real difference on the journey."',tip:'Only offer where the product exists on that route.'},
  {q:'Two-week trip, only the standard allowance included',a:'"You\'re away for two weeks, and your allowance is [X]kg each. If you\'re likely to bring home souvenirs, adding weight now is far cheaper than paying at the airport. Shall I add [10]kg?"',tip:'Compare to the cost they will face if they wait.'},
  {q:'Customer has not pre-booked meals',a:'"Would you like to pre-order a meal? It\'s usually better value than buying onboard and it guarantees your choice. There\'s a range from £[X]."',tip:'Keep it light. Mention value and certainty.'}]},
 {t:'drill',title:'Upsell: upgrade the booking',sub:'Move customers from "good" to "better" when it genuinely serves them.',lead:'Situation',items:[
  {q:'Customer might need to change plans, but booked the basic fare',a:'"For just £[X] more per person, you could choose a flexible fare. That means you can change your dates if anything shifts. A lot of customers like that peace of mind."',tip:'Frame as insurance against uncertainty.'},
  {q:'Honeymoon or anniversary trip, standard seats',a:'"Congratulations! As it\'s such a special trip, would you like to look at upgrading to [Premium / extra comfort]? There\'s more space and a more relaxed journey, from £[X] per person."',tip:'Celebrate first, then offer.'},
  {q:'Customer chooses the 6am flight because it is cheaper',a:'"The 6am flight is cheaper, but it means leaving for the airport around [2am]. A later flight at [11am] is £[X] more per person. Which would suit you better?"',tip:'Show the hidden cost of the cheaper option, then let them choose.'},
  {q:'Customer is flying out on Friday and back Sunday week',a:'"If you added one more night, you\'d make the most of your time away. The extra night costs about £[X] per person. Would you like me to check availability?"',tip:'Price per night or per day often makes it feel small.'}]},
 {t:'drill',title:'Upsell: hotel, transfers and extras',sub:'For package or hotel bookings, and for adding value after flights.',lead:'Situation',items:[
  {q:'Hotel booked on room-only or bed-and-breakfast',a:'"Would you like to look at upgrading to half board? For £[X] per person per night, your evening meals are sorted. That works out at roughly £[X] a day and means no worrying about restaurant bills."',tip:'Convert to a daily figure: it sounds smaller and is easy to compare.'},
  {q:'Couple booked a standard room',a:'"For £[X] extra, you could have a sea-view room. Waking up to that view is a lovely touch on a special trip. Shall I check availability?"',tip:'Use sensory language: describe the experience, not just the room.'},
  {q:'Customer has not arranged airport transfers',a:'"Do you have transport arranged from the airport to your hotel? We can add a transfer so you\'re met on arrival, which is especially handy after a long flight. It\'s £[X] per person."',tip:'Ask about their plan first, then offer the solution.'},
  {q:'Customer booked flights and a separate hotel',a:'"Would you like me to quote a package for the same dates? Package holidays include extra financial protection, and sometimes the combined price works out better."',tip:'Check current pricing and ATOL/protection wording with your account policy before promising.'}]},
 {t:'drill',title:'Cross-sell & retention',sub:'Insurance, cancellations and customers who say no to everything.',lead:'Situation',items:[
  {q:'Travel insurance: customer has not mentioned any',a:'(If authorised) "Have you arranged travel insurance for the trip? I can give you the details of the cover we offer."\n(If not authorised) "I\'m not able to advise on insurance, but it\'s strongly recommended to have cover in place before you travel."',tip:'Insurance is regulated. Use only approved wording and only if you are authorised.'},
  {q:'Customer wants to cancel the whole booking',a:'"I\'m sorry to hear that. Before I go ahead, may I ask what\'s changed? There may be options like moving the dates or changing the destination that could work. If not, I\'ll explain exactly what the cancellation involves."',tip:'Understand the reason first, then offer one alternative, then respect the decision.'},
  {q:'Customer says no to every add-on',a:'"Of course, no problem at all. I\'ve kept your booking as it is. If you change your mind, you can add extras up to [deadline] online or by calling us."',tip:'Never push after two clear no\'s. A good exit protects the relationship.'},
  {q:'Customer asks: "Is it worth it?" about an add-on',a:'"Good question. If [their specific concern, e.g. sitting together / bringing extra luggage] matters to you, then yes, it\'s good value. If it doesn\'t, you can skip it and nothing is lost."',tip:'Honesty builds trust and often leads to more sales.'}]},
 {t:'compare',title:'Upselling: say this, not that',sub:'Small wording changes make the same offer feel like help rather than pressure.',left:'Say this',right:'Not this',rows:[
  ['Because you mentioned the children, seats together might help.','Do you want to buy seats?'],
  ['It\'s £[X] per person each way.','That\'ll be £[total] extra.'],
  ['Would you like me to add that for you?','You should really get this.'],
  ['No problem at all, you can add it later if you change your mind.','Are you sure? You\'ll regret it at the airport.'],
  ['Some customers find this really useful because [reason].','Everyone buys this.']]}
]},

{id:'obj',name:'Objections',icon:'shield',acc:'#c98a12',soft:'#fff2d9',slides:[
 {t:'steps',title:'The ACAA method for any objection',sub:'An objection is a customer telling you what they need before they say yes.',steps:[
  {h:'Acknowledge',p:'Show you heard them: "I understand price matters." Never argue first.'},
  {h:'Clarify',p:'Find the real concern: "May I ask what you\'re comparing it with?"'},
  {h:'Answer',p:'Give a short, honest answer or an alternative that fits their concern.'},
  {h:'Advance',p:'Move the call forward: "Shall I go ahead with that?" or "What would you like to do?"'}],note:'Avoid the word "but". Use "and" or "so" to keep the customer with you.'},
 {t:'drill',title:'Price objections (1)',sub:'The most common reason a sale stalls.',lead:'Customer says',items:[
  {q:'"That\'s too expensive."',a:'"I understand price matters. Let me see what I can do. Are your dates flexible by a day or two, or would you consider a nearby airport? I can also look at whether you need all the extras so you only pay for what matters."',tip:'Find flexibility: dates, airport, extras, board basis.'},
  {q:'"I saw it cheaper on another site."',a:'"Thanks for telling me. Prices can vary by channel and what\'s included. May I ask what you saw, including bags and transfers? Let me check like for like and see the best I can offer."',tip:'Never criticise competitors. Only match if your policy allows.'},
  {q:'"The price is different from the website."',a:'"Prices update in real time with availability, so the fare you saw may have sold out. Let me check the live price now and find the best option for you."',tip:'Explain simply. Don\'t imply they made a mistake.'},
  {q:'"Why are there so many hidden charges?"',a:'"I can see why that\'s frustrating. The base fare covers your seat on the flight, and things like bags, seats and meals are optional so you only pay for what you need. Let me show you what your total would look like."',tip:'Reframe extras as choice. Then show a clear total.'}]},
 {t:'drill',title:'Price objections (2)',sub:'Discounts, seats, bags and payment.',lead:'Customer says',items:[
  {q:'"Can I get a discount?"',a:'"Let me check what offers are available on this booking. [If none:] I can\'t offer a discount on this one, but I can look at alternatives that bring the cost down, like a different departure day."',tip:'Check, then offer an alternative. Never promise what you can\'t give.'},
  {q:'"Charging for seats is a rip-off."',a:'"I understand. Seat selection is optional. If you don\'t choose, seats are allocated at check-in and families may not sit together. If that matters to you, it\'s best to reserve now."',tip:'State the real consequence calmly, without scaring them.'},
  {q:'"Baggage costs too much."',a:'"Adding bags now is usually much cheaper than at the airport. Let me check the allowance already included and the options. Would [10kg / 15kg] be enough?"',tip:'Offer the smallest option that solves their need.'},
  {q:'"Can I pay in instalments or a smaller deposit?"',a:'"Let me check the payment options for your booking. For many bookings you can pay a deposit now, with the balance due by [date]. I\'ll explain the amounts clearly before anything is taken."',tip:'Know your account\'s payment rules. Never guess deadlines.'}]},
 {t:'drill',title:'Hesitation & delay',sub:'"I\'ll think about it" usually means "I\'m not sure yet".',lead:'Customer says',items:[
  {q:'"I need to think about it."',a:'"Of course, it\'s a big decision. So I can help, is there something in particular you\'re unsure about, such as price, dates, or the hotel? Prices and availability can change, so I\'m happy to [send you a quote / note it on your account]."',tip:'Ask what is holding them back. Don\'t pressure. Offer a follow-up option.'},
  {q:'"I need to speak to my partner."',a:'"Absolutely. Would it help if I emailed you the details so you can look through them together? Prices are live, so it\'s best to decide soon. When do you think you might call back?"',tip:'Make the next step easy: email, quote, callback time.'},
  {q:'"I\'ll call back later."',a:'"No problem. Before you go, may I note it on your account so you don\'t have to start again? And just so you know, [availability/price] can change, so the sooner the better."',tip:'Leave a clean trail and a gentle reason to return.'},
  {q:'"I\'ll just book it online myself."',a:'"That\'s absolutely fine. Is there anything stopping you from booking today with me? I can check the best price now and add anything you need, so it\'s all done in one go."',tip:'Offer a clear benefit of booking now. Accept their choice if they refuse.'}]},
 {t:'drill',title:'Doubts & questions',sub:'Reassure without over-promising.',lead:'Customer says',items:[
  {q:'"Is this really the best price?"',a:'"This is the best available price for these dates and this flight right now. If you\'d like, I can check a day either side to see whether you could save."',tip:'Be honest. "Best available now" is accurate and safe.'},
  {q:'"Is it safe to travel to [destination]?"',a:'"I can\'t advise on safety myself. The official guidance comes from the UK Foreign, Commonwealth & Development Office, so I\'d recommend checking their travel advice before you travel. I can explain our policy for bookings if the advice changes."',tip:'Point to the official source. Never give your own opinion on safety.'},
  {q:'"Do I have to pay for my baby / toddler?"',a:'"It depends on your child\'s age on the date of travel. Let me check the exact rules for your flight so I can give you accurate pricing."',tip:'Age-based fares vary. Verify before quoting.'},
  {q:'"I\'m not sure about the destination at all."',a:'"That\'s fine, we can work it out together. What matters most: beaches, culture, food, or somewhere easy with children? Tell me your dates and budget and I\'ll suggest a few options."',tip:'You become the guide. Narrow down with questions.'}]},
 {t:'drill',title:'Trust & service objections (1)',sub:'When the customer is questioning you or the process.',lead:'Customer says',items:[
  {q:'"I want to speak to your manager."',a:'"Of course. I\'ll do everything I can to resolve this first, and if you\'d still like a supervisor, I\'ll arrange that. Could you tell me what\'s happened so I can brief them properly?"',tip:'Follow the escalation policy. Never refuse, but offer to help first.'},
  {q:'"You\'re just reading from a script."',a:'"I understand it can feel that way. Let me be direct: here\'s what I can do for you right now... [clear options]. Which would you prefer?"',tip:'Drop the script tone and get specific and concrete.'},
  {q:'"Is this call recorded?"',a:'"Yes, calls may be recorded for training and quality purposes."',tip:'Short and honest. Use your account\'s exact wording.'},
  {q:'"Can I get that in writing?"',a:'"Absolutely. I\'ll send a confirmation email straight after the call. It should reach you within [X]. Is [email] still the best address?"',tip:'Confirm the address and timeframe.'}]},
 {t:'drill',title:'Trust & service objections (2)',sub:'Honesty, protection and ownership.',lead:'Customer says',items:[
  {q:'"I don\'t trust call centres. Who are you?"',a:'"I understand. I\'m part of the customer service team supporting TUI customers, and I\'ve got your booking in front of me. I\'ll note everything we agree, and you\'ll receive written confirmation."',tip:'Never lie about who or where you are. Be transparent and focus on what you can show.'},
  {q:'"Can I have your name and ID?"',a:'"Of course, it\'s [Name], and the reference for this call is [ID]."',tip:'Give it freely. Hesitating makes it look like you have something to hide.'},
  {q:'"I was told something different last time."',a:'"I\'m sorry for the confusion. Let me check the notes and see what was said. Whatever happened, I\'ll make sure we clear it up now."',tip:'Don\'t blame the colleague. Check and fix.'},
  {q:'"Is my booking protected?"',a:'"Package holidays booked with TUI are usually covered by financial protection such as ATOL, and you\'ll receive a certificate. Protection varies by product, so let me confirm exactly what applies to your booking."',tip:'Confirm what applies to the specific booking. Don\'t give blanket guarantees.'}]}
]},

{id:'angry',name:'Angry customers',icon:'frown',acc:'#d4495a',soft:'#ffe7ea',slides:[
 {t:'steps',title:'De-escalation: H.E.A.R.D.',sub:'A calm, repeatable structure for the toughest calls.',steps:[
  {h:'Hear them out',p:'Let them vent without interrupting. Take brief notes. Silence is okay.'},
  {h:'Empathise',p:'Name the feeling: "I can hear how frustrating this has been."'},
  {h:'Apologise',p:'Apologise for the experience, not for blame: "I\'m really sorry this happened."'},
  {h:'Resolve',p:'Offer clear options with timelines. Use "here\'s what I can do".'},
  {h:'Deliver & follow up',p:'Do what you promised, note it, and tell them what happens next.'}],note:'Lower your voice and slow down. Anger usually matches the other person\'s energy.'},
 {t:'drill',title:'Shouting, abuse and threats',sub:'Stay calm, stay professional, stay in control.',lead:'Customer says',items:[
  {q:'(Shouting) "This is ridiculous! I\'ve paid thousands for this!"',a:'"You\'re absolutely right to be upset, and I\'m sorry. I\'m going to take ownership of this. Could you tell me what\'s happened so I understand it fully?"',tip:'Validate, take ownership, ask a question. Questions calm people down.'},
  {q:'(Swearing at you)',a:'1st: "I want to help you, and I\'d appreciate it if we could keep the conversation respectful."\n2nd: "I\'m happy to continue, but I need us to keep the language respectful."\nFinal: "I\'m sorry, I\'m unable to continue while the language continues. I\'ll end the call now. You\'re welcome to call back."',tip:'Follow your abuse policy exactly: warnings, then end the call and log it.'},
  {q:'"I want compensation!"',a:'"I understand. Let me look at exactly what happened first, then I\'ll explain what options are available. I can also raise a formal request for review."',tip:'Never promise compensation. Explain the process and timeline.'},
  {q:'"I\'m going to post this all over social media!"',a:'"That\'s your right, and I\'d like the chance to put this right first. Let me see what I can do for you now."',tip:'Don\'t get defensive or threaten. Refocus on solving.'}]},
 {t:'drill',title:'Repeat callers and broken trust',sub:'Customers who have been let down before.',lead:'Customer says',items:[
  {q:'"This is the third time I\'ve called about this!"',a:'"I\'m sorry you\'ve had to call again. I\'ve read the notes, and I\'ll personally make sure we get this resolved today. Here\'s what I\'m going to do: [action 1], [action 2], and you\'ll hear back by [time]."',tip:'Show you know the history. Give specific actions and a deadline.'},
  {q:'"You\'re useless!"',a:'"I\'m sorry I haven\'t been able to give you the answer you need yet. Give me a moment to check, and I\'ll do everything I can to help."',tip:'Don\'t take it personally. Move to action.'},
  {q:'"My holiday is ruined."',a:'"I\'m so sorry. I know how much you were looking forward to this. Let\'s see what we can do to get things back on track. Can you tell me what\'s happened?"',tip:'Empathy first. Solutions only after they feel heard.'},
  {q:'"I\'ll never book with TUI again."',a:'"I\'m really sorry to hear that. I\'d like to fix this if I can. Could you tell me what happened, so I can see how to put it right?"',tip:'Don\'t beg or argue. Show you care and want to fix it.'}]},
 {t:'drill',title:'Escalations and sensitive moments',sub:'The hardest conversations call for the most human responses.',lead:'Customer says',items:[
  {q:'Customer insists on a supervisor for the second time',a:'"Certainly. I\'ll arrange for a team leader to [call you back by [time] / join us]. Let me give you a reference and brief them fully so you won\'t need to repeat yourself."',tip:'Follow your escalation procedure. Give a reference and a timeframe.'},
  {q:'Customer is crying or distressed (e.g. bereavement)',a:'"I\'m so sorry for your loss. Please take your time. I\'m going to help you with everything we need to do. Let\'s start with what you\'d like to happen with the booking."',tip:'Slow down. Be gentle. Use the vulnerable-customer procedure.'},
  {q:'Customer keeps talking over you',a:'"I want to make sure I understand everything. May I ask for a moment to check this properly? Then I\'ll tell you exactly what I can do."',tip:'Calm, steady tone. Don\'t raise your voice to match them.'},
  {q:'Customer demands a refund on a non-refundable fare',a:'"I\'m sorry. I can see this fare is non-refundable under the terms. What I can do is [alternatives such as changing dates, credit, or looking at what the insurance covers]. Would you like to look at those?"',tip:'Be clear about the rule, then lead with what you can do.'}]},
 {t:'compare',title:'Phrases to use and phrases to avoid',sub:'Words can calm a call or light it up.',left:'Use',right:'Avoid',rows:[
  ['I understand how frustrating this is.','Calm down.'],
  ['Let me check what I can do.','That\'s not my department.'],
  ['I don\'t have that information, but I\'ll find out.','I don\'t know.'],
  ['Here\'s what I can do for you...','There\'s nothing I can do.'],
  ['I\'m sorry you\'ve had that experience.','That\'s our policy.'],
  ['Let me explain how this works.','You should have read the terms.']]},
 {t:'cards',title:'Reset after a tough call',sub:'Protect your energy so the next customer gets your best.',cards:[
  {i:'refresh',h:'Reset breath',p:'Slow breath in, slower out. Ten seconds. Drop your shoulders.'},
  {i:'users',h:'Don\'t carry it',p:'The anger was about the situation, not about you. Say that to yourself.'},
  {i:'file',h:'Note it clearly',p:'Write facts: what happened, what you did, what you promised. It clears your head.'},
  {i:'headset',h:'Ask for support',p:'Talk to your team leader after a rough call. Escalating is a skill, not a failure.'}]}
]},

{id:'sys',name:'System & disruptions',icon:'monitor',acc:'#2d86c4',soft:'#e0f1fb',slides:[
 {t:'steps',title:'System issue protocol',sub:'Customers forgive technical problems when you handle them openly and keep control.',steps:[
  {h:'Tell them early',p:'Don\'t go silent. "My system is a little slow, thanks for bearing with me."'},
  {h:'Offer a choice',p:'Hold for a short time, or take a callback. Let them decide.'},
  {h:'Capture details',p:'Confirm the best number, booking ref, and exactly what they were trying to do.'},
  {h:'Try a workaround',p:'Use alternative tools or procedures your team provides.'},
  {h:'Escalate or log',p:'Raise a ticket or inform your team leader. Note the reference.'},
  {h:'Confirm the next step',p:'Say what will happen, who will do it, and by when.'}]},
 {t:'drill',title:'System issues (1)',sub:'Slow systems, outages and payment problems.',lead:'Situation',items:[
  {q:'Your system is running slowly',a:'"I apologise, my system is running a little slowly. Thank you for your patience. While it loads, can I ask you a couple of quick questions about [the trip / what you need]?"',tip:'Fill the time with useful questions, not silence or chit-chat.'},
  {q:'System is down and you cannot access the booking',a:'"I\'m sorry, my system is unavailable at the moment. I don\'t want you to wait, so may I take a contact number and arrange a call back within [X]? Or if you\'d prefer, you can hold for a short time."',tip:'Give a clear choice and a realistic timeframe.'},
  {q:'Payment declined',a:'"It looks like the payment hasn\'t gone through. This can happen for a few reasons, such as a limit or a bank security check. Would you like to try another card, or would you prefer to contact your bank first?"',tip:'No blame. Offer two simple options.'},
  {q:'Payment taken but no booking confirmation',a:'"I can see the payment, but not the booking confirmation yet. Let me look into it and raise it with the right team. I\'ll give you a reference, and we\'ll come back to you by [time]."',tip:'Don\'t promise refunds or timings you can\'t guarantee. Escalate properly.'}]},
 {t:'drill',title:'System issues (2)',sub:'Missing bookings, duplicates, emails and errors.',lead:'Situation',items:[
  {q:'Booking is not showing under the reference given',a:'"I can\'t see it under that reference. Let me check a few variations such as spelling, the email used, or the travel date. It might also have been booked through a travel agent."',tip:'Systematic checks, said out loud, build confidence.'},
  {q:'Duplicate booking found',a:'"I can see two bookings in the same name for the same dates. Let\'s confirm which one you\'d like to keep. Cancelling the other may be subject to terms, so I\'ll check exactly what applies."',tip:'Confirm which to keep before touching anything.'},
  {q:'Confirmation email not received',a:'"Let me check the email address on file. [Read back.] I\'ve resent it now, and it should arrive within a few minutes. Please check your junk folder too."',tip:'Verify the email spelling first. It\'s the most common cause.'},
  {q:'Error appears while you are amending the booking',a:'"I\'m getting an error on my side. I\'ll note it and escalate, and I\'ll confirm back to you by [time]. Please don\'t make changes online in the meantime so we avoid creating duplicates."',tip:'Prevent customers from making things worse while it is being fixed.'}]},
 {t:'drill',title:'Call control phrases',sub:'Holds, callbacks and "I don\'t know" moments.',lead:'Situation',items:[
  {q:'The call may drop or the line is poor',a:'"In case we get disconnected, I\'ll call you straight back on [number]. Is that the best number to reach you on?"',tip:'Always confirm the number. Call back immediately if it drops.'},
  {q:'You need to place the customer on hold',a:'"May I place you on a brief hold while I check that? It should take about two minutes."\nWhen back: "Thank you so much for holding, and I\'m sorry for the wait."',tip:'Ask permission. Return within the time you promised, or check back in.'},
  {q:'You do not know the answer',a:'"That\'s a good question. I want to give you the right information, so please give me a moment to check."',tip:'Never guess. Check, then answer.'},
  {q:'You promise a callback',a:'"I\'ll call you back by [time] today. If you haven\'t heard from us by then, please call and quote reference [ID]."',tip:'Only promise what you can deliver. Then actually do it.'}]},
 {t:'cards',title:'Disruption quick facts (check current policy)',sub:'General UK-based principles that often come up. Always confirm against your account\'s current guidance before quoting.',cards:[
  {i:'clock',h:'Long delays',p:'UK flight-delay rules can mean compensation for arrival delays of 3 hours or more, depending on the cause. Typical bands are £220, £350 or £520 by distance.'},
  {i:'alert',h:'Extraordinary circumstances',p:'Severe weather, air traffic control restrictions or some third-party strikes can remove the compensation right, but customers may still have other rights.'},
  {i:'heart',h:'Duty of care',p:'For longer delays, customers may be entitled to refreshments, communication, and accommodation and transport if overnight.'},
  {i:'card',h:'Refunds',p:'If a flight is cancelled, customers can usually choose a refund or re-routing. Timeframes are set by law and policy. Quote only what your policy says.'},
  {i:'file',h:'Package vs flight-only',p:'Rights and protection can differ between packages and flight-only bookings. Check which type the booking is first.'},
  {i:'shield',h:'Official guidance',p:'For entry rules and safety, point customers to GOV.UK foreign travel advice. Never give your own view.'}]},
 {t:'drill',title:'Disruptions (1)',sub:'Delays, cancellations and changes.',lead:'Customer says',items:[
  {q:'"My flight has been delayed."',a:'"I\'m sorry about the delay. Let me check the latest status. [Share update.] Please keep an eye on airport announcements. If the delay is long, I can explain what you may be entitled to, depending on the cause."',tip:'Info first, then rights. Avoid promising compensation.'},
  {q:'"My flight has been cancelled."',a:'"I\'m so sorry. Let me see your options. You may be able to be rebooked on the next available flight, or ask for a refund. Which would you prefer?"',tip:'Lead with options. Clarify the customer\'s priority (date vs money).'},
  {q:'"You\'ve changed my flight time."',a:'"I understand how disruptive that is. Let me check the new time. Depending on how big the change is, you may be able to accept it, choose a different flight, or ask for a refund. What works best for you?"',tip:'Know the thresholds for "significant change" in your policy.'},
  {q:'"I missed my flight!"',a:'"I\'m sorry to hear that. Let me check the fare rules and see what\'s possible. Options may include rebooking onto another flight, which could involve a fee. Where are you now?"',tip:'Ask where they are and how urgent it is. Move quickly.'}]},
 {t:'drill',title:'Disruptions (2)',sub:'Strikes, bags, names and documents.',lead:'Customer says',items:[
  {q:'"There\'s a strike / storm. Can I cancel?"',a:'"I understand the concern. Let me check the current status of your flight. If it\'s still operating, standard terms apply. If it\'s cancelled or changed, we\'ll look at your options straight away."',tip:'Check facts first. Do not pre-empt cancellations.'},
  {q:'"My luggage is lost."',a:'"I\'m so sorry. Baggage claims are handled by the airline or airport. Please file a Property Irregularity Report at the baggage desk before leaving the airport. Keep receipts for essentials, and I can give you the contact details."',tip:'The PIR (Property Irregularity Report) is the key first step.'},
  {q:'"The name on my booking is wrong."',a:'"The name needs to match the passport exactly, so let\'s fix that. Could you give me the correct spelling? I\'ll check the correction process, and whether any fee applies."',tip:'Treat as urgent, especially close to departure.'},
  {q:'"Do I need a visa or does my passport work?"',a:'"Entry rules vary by country and passport. For the most accurate information, I recommend checking GOV.UK foreign travel advice for your destination. I can note it on your booking if you\'d like."',tip:'Don\'t quote entry rules from memory. Point to the official source.'}]},
 {t:'drill',title:'Disruptions (3)',sub:'Medical issues, assistance, refunds and check-in.',lead:'Customer says',items:[
  {q:'"I\'m ill and can\'t travel."',a:'"I\'m sorry to hear that. Let\'s see what we can do. You may need a doctor\'s note, and your travel insurance may cover this. Let me check what the booking terms say."',tip:'Gentle and practical. Explain documents needed.'},
  {q:'"My mum needs wheelchair assistance."',a:'"Of course. We can arrange assistance, and it\'s best to book it as early as possible, usually at least [48 hours] before travel. May I take the details?"',tip:'Take full details: type of assistance, passenger name, flight.'},
  {q:'"Where is my refund?"',a:'"I understand it\'s taking a while. Let me check the status. Refunds are returned to the original payment method and can take [X working days] to appear. [Share status.] Is there anything else I can check?"',tip:'Give a date range from your policy, not a guess.'},
  {q:'"I can\'t check in online."',a:'"Let me help. Online check-in opens [X hours] before departure. Can you check that the booking reference and surname match? If it still doesn\'t work, we\'ll look at other options."',tip:'Check the timing and the details first. These solve most cases.'}]}
]},

{id:'req',name:'Requests & closing',icon:'check',acc:'#5b6b8c',soft:'#e8ecf4',slides:[
 {t:'drill',title:'Common requests (1)',sub:'Quick, confident handling of everyday asks.',lead:'Customer says',items:[
  {q:'"I want to change my travel date."',a:'"No problem. Let me check availability. I\'ll look at the fare rules, and there may be a change fee and a fare difference. I\'ll give you the full price before I make any changes. Which new date were you thinking of?"',tip:'Always disclose the full cost before committing.'},
  {q:'"I need to cancel my booking."',a:'"I\'m sorry to hear that. Could I ask what\'s changed? Sometimes we can move the dates instead. If you do want to cancel, I\'ll explain exactly what that means for refunds and fees."',tip:'Discover, offer one alternative, then process clearly.'},
  {q:'"I need to add a child or an infant."',a:'"Of course. May I have their full name as it appears on the passport, date of birth, and travel dates? I\'ll check the price and then add them."',tip:'Take names exactly as on the passport. Age on the date of travel matters.'},
  {q:'"I want to add baggage."',a:'"Happy to help. How many bags and roughly what weight? I\'ll check the price now, and it\'s cheaper than paying at the airport."',tip:'A good moment to also offer seats or meals.'}]},
 {t:'drill',title:'Common requests (2)',sub:'Seats, payments, documents and complaints.',lead:'Customer says',items:[
  {q:'"I want to change my seats."',a:'"Certainly. Where would you like to sit, and who\'s travelling? I\'ll check what\'s available for your flight and let you know about any cost."',tip:'Ask who they need to sit with. Then find the best fit.'},
  {q:'"When do I pay the balance?"',a:'"Let me check your booking. The balance is due by [date], and the amount is £[X]. Would you like to pay now, or shall I send a reminder?"',tip:'Quote dates and amounts exactly. Offer to take payment.'},
  {q:'"I haven\'t got my e-ticket / ATOL certificate."',a:'"No problem. Let me check the email address on file. [Read back.] I\'ll resend your documents now. They should arrive within [X], so please check junk mail too."',tip:'Verify the email, resend, set a timeframe.'},
  {q:'"I want to make a formal complaint."',a:'"I\'m sorry things have gone wrong. I\'ll log a formal complaint now. May I take the full details? You\'ll receive an acknowledgement and a response within [timeframe] as per our process."',tip:'Never discourage complaints. Log accurately and explain the process.'}]},
 {t:'drill',title:'Hold, transfer and escalate',sub:'Handovers done well protect the customer experience.',lead:'Situation',items:[
  {q:'Putting a customer on hold',a:'"Do you mind if I place you on a short hold while I check this? It should take about two minutes."',tip:'Always ask. Always return when you said you would.'},
  {q:'Warm transfer to another team',a:'"I\'m going to introduce you to my colleague in [team], who can help with this. I\'ll give them the details so you don\'t have to repeat yourself. Is that okay?"',tip:'Brief the next agent before connecting the customer.'},
  {q:'Escalating to a supervisor',a:'"I\'ll bring in a team leader to help. I\'ll explain what\'s happened so you don\'t have to repeat it. Please hold for a moment."',tip:'Offer a callback if the supervisor isn\'t immediately available.'},
  {q:'You need to call the customer back',a:'"I\'ll call you back on [number] by [time]. If you don\'t hear from me, please call and quote [reference]."',tip:'Put the callback in the notes with the exact time.'}]},
 {t:'drill',title:'Closing the call',sub:'The last 20 seconds shape how the customer remembers the whole call.',lead:'Situation',items:[
  {q:'Standard close with a recap',a:'"Just to summarise: we\'ve [actions]. You\'ll receive [email] within [time], and the next step is [next step]. Is there anything else I can help you with today?"',tip:'Summaries prevent follow-up calls.'},
  {q:'Positive close after a sale',a:'"Thank you for choosing TUI. It\'s been a pleasure helping you, and I hope you have a wonderful holiday!"',tip:'Warm, specific, unhurried.'},
  {q:'Closing after a difficult call',a:'"Thank you for your patience today, and I\'m sorry again for the trouble. I\'ve noted everything on your account, and if you need anything else, please call us and quote [reference]."',tip:'End steady and respectful. Leave on a solution, not an argument.'},
  {q:'Mentioning a survey (if your process allows)',a:'"You may receive a short survey after this call. If you feel I\'ve helped, I\'d really appreciate your feedback."',tip:'Never coach or pressure for scores. Mention it neutrally.'}]},
 {t:'cards',title:'Wrap-up notes template',sub:'Good notes save your colleagues (and the customer) from repeating everything.',cards:[
  {i:'user',h:'Who',p:'Caller name, relationship to the booking, whether verified.'},
  {i:'search',h:'Issue',p:'One clear sentence: what the customer wanted or what went wrong.'},
  {i:'check',h:'Actions taken',p:'Exactly what you did, in order, with reference numbers.'},
  {i:'clock',h:'Promises',p:'What you said would happen, who owns it, and by when.'},
  {i:'trend',h:'Offers made',p:'Upsells offered and accepted or declined.'},
  {i:'right',h:'Next step',p:'What should the next person do if the customer calls back?'}]}
]},

{id:'pre',name:'Pre-Travel: Hotels',icon:'home',acc:'#0e7490',soft:'#cffafe',slides:[
 {t:'cards',title:'What Pre-Travel looks after',sub:'You are the customer\'s main contact between booking and departure. Know these areas well.',cards:[
  {i:'home',h:'Hotel and room',p:'Room types, board basis, facilities, special requests and changes.'},
  {i:'plane',h:'Flight extras',p:'Seats, baggage, meals, assistance and flight questions.'},
  {i:'file',h:'Documents and checks',p:'Names matching passports, e-tickets, ATOL certificates, and pointing to GOV.UK for entry rules.'},
  {i:'card',h:'Payments',p:'Balance due dates, deposits, failed payments and receipts.'},
  {i:'heart',h:'Special occasions and needs',p:'Honeymoons, birthdays, accessibility, dietary needs, travelling with children.'},
  {i:'star',h:'Reassurance',p:'Many customers are excited or nervous. A friendly, clear call now prevents problems later.'}]},
 {t:'cards',title:'Room types: what customers ask about',sub:'Always confirm exactly what is booked before explaining. Names vary by hotel.',cards:[
  {i:'users',h:'Twin vs double',p:'Twin means two single beds. Double means one double bed. Always confirm which the customer wants.'},
  {i:'home',h:'Family room',p:'A larger room or connecting rooms. Check the maximum number of adults and children.'},
  {i:'star',h:'Superior / Deluxe',p:'Usually larger or newer than standard, sometimes with a better view or balcony. Check what is actually included.'},
  {i:'globe',h:'Views',p:'Sea view, partial sea view, pool view and garden view differ in price. Be accurate and do not promise a specific room.'},
  {i:'heart',h:'Suite / junior suite',p:'A suite has a separate living area. A junior suite is a larger open-plan room.'},
  {i:'shield',h:'Accessible / ground floor',p:'Needed for mobility. Note it and confirm with the hotel as early as possible.'}]},
 {t:'cards',title:'Board basis: what is included',sub:'The most common source of confusion. Check the hotel\'s exact inclusions before quoting.',cards:[
  {i:'bag',h:'Room only (RO)',p:'Accommodation only. No meals included.'},
  {i:'home',h:'Self-catering (SC)',p:'Apartment or villa with a kitchen. No meals included.'},
  {i:'smile',h:'Bed and breakfast (BB)',p:'Breakfast included.'},
  {i:'clock',h:'Half board (HB)',p:'Breakfast and evening meal. Drinks are usually extra.'},
  {i:'check',h:'Full board (FB)',p:'Breakfast, lunch and dinner. Drinks are usually extra.'},
  {i:'star',h:'All inclusive (AI)',p:'Meals, snacks and many drinks. Exact inclusions and drink brands vary by hotel, so check.'}]},
 {t:'cards',title:'Hotel facilities worth asking about',sub:'Use these to discover needs, then recommend or upsell naturally.',cards:[
  {i:'users',h:'Kids and families',p:'Kids club, children\'s pool, cots, high chairs, family rooms.'},
  {i:'heart',h:'Adults only',p:'Some hotels are adults only or have adults-only areas.'},
  {i:'globe',h:'Beach and location',p:'Distance to the beach, town and airport. Is it beachfront?'},
  {i:'star',h:'Pool, spa and gym',p:'Number of pools, heated pools, spa treatments (often extra), gym.'},
  {i:'chat',h:'Entertainment and Wi-Fi',p:'Evening shows, activities, whether Wi-Fi is free or chargeable.'},
  {i:'clock',h:'Check-in and check-out',p:'Standard times, and early check-in or late check-out requests.'}]},
 {t:'drill',title:'Hotel requests from customers',sub:'Requests are passed to the hotel. Never guarantee unless it is confirmed.',lead:'Customer says',items:[
  {q:'"Can we have two rooms next to each other?"',a:'"I\'ll add that request to the booking. Hotels can\'t always guarantee it, but we\'ll pass it on and ask them to do their best."',tip:'Noted is not guaranteed. Say so honestly.'},
  {q:'"Can I have a cot for my baby?"',a:'"Of course. May I take your baby\'s age? I\'ll check the cot availability with the hotel and add the request."',tip:'Take the age and travel date. Check if a charge applies.'},
  {q:'"It\'s our honeymoon. Can we get a room upgrade?"',a:'"Congratulations! I\'ll note the honeymoon on your booking. An upgrade can\'t be promised, but I can look at paying for a better room type. Shall I check prices?"',tip:'Celebrate first, then offer a real option.'},
  {q:'"I\'m allergic to nuts. Is the food safe?"',a:'"Thank you for telling me. I\'ll note it on your booking and ask the hotel to be aware. Please also tell the restaurant staff when you arrive."',tip:'Never promise a safe environment. Note it and advise them to tell staff.'},
  {q:'"Can we check in early? We land at 7am."',a:'"I\'ll add an early check-in request. Standard check-in is usually [time], so it depends on availability on the day. Some hotels offer early check-in for a fee."',tip:'Set expectations: request noted, not guaranteed.'},
  {q:'"I want a quiet room, high up, away from the lift."',a:'"I\'ll add that request. I can\'t promise a specific room, but the hotel will see your preferences."',tip:'Write the exact request in the notes.'},
  {q:'"My mum can\'t manage stairs. Do you have ground floor rooms?"',a:'"I\'ll find out for you. May I take the details of the mobility needs so I can pass them to the hotel clearly?"',tip:'Take full details, confirm with the hotel, follow up in writing.'},
  {q:'"Can we add an extra bed for our teenager?"',a:'"Let me check the maximum occupancy of your room. If it\'s possible, there may be a charge. If not, a family room could work better."',tip:'Check occupancy before saying yes.'}]},
 {t:'compare',title:'Hotel requests: say this, not that',sub:'Accuracy protects the customer and the company.',left:'Say this',right:'Not this',rows:[
  ['I\'ll pass your request to the hotel.','You\'ll definitely get a sea view.'],
  ['It\'s noted, but it can\'t be guaranteed.','Don\'t worry, it\'s sorted.'],
  ['Let me check what is included in your board basis.','All inclusive means everything is free.'],
  ['I\'ll confirm the room type for you.','They\'re all the same.'],
  ['The hotel will confirm on arrival.','I\'m sure it will be fine.']]},
 {t:'steps',title:'Hotel checklist before you advise',sub:'Know these facts before answering any hotel question.',steps:[
  {h:'Room type and occupancy',p:'Twin or double, who is in the room, and the maximum adults and children.'},
  {h:'Board basis',p:'Room only, BB, HB, FB or all inclusive, and what drinks and meals are included.'},
  {h:'Dates and check-in times',p:'Arrival and departure dates, standard check-in and check-out times.'},
  {h:'Location and facilities',p:'Beach distance, pools, kids club, adults only, seasonal closures.'},
  {h:'Extra costs',p:'Local tourist tax, resort fees, optional extras paid at the hotel.'},
  {h:'Special requests',p:'Write each request exactly as the customer said, and say it is not guaranteed.'}]}
]},

{id:'fly',name:'Pre-Travel: Flights',icon:'plane',acc:'#4338ca',soft:'#e0e7ff',slides:[
 {t:'cards',title:'Flight extras customers can add',sub:'Know what exists, what it costs, and when to offer it. Always check the airline\'s current options.',cards:[
  {i:'users',h:'Seat selection',p:'Standard seats, extra legroom and front-of-cabin seats. Useful for families who want to sit together.'},
  {i:'bag',h:'Hold luggage',p:'Extra bags and extra weight. Cheaper to add before travel than at the airport.'},
  {i:'headset',h:'Cabin bag and priority',p:'Cabin bag size, and priority boarding where available.'},
  {i:'heart',h:'Meals',p:'Pre-order meals, and special meals such as vegetarian, halal or gluten-free.'},
  {i:'shield',h:'Special assistance',p:'Wheelchair, mobility help, medical needs. Needs advance notice.'},
  {i:'star',h:'Sports and special items',p:'Golf clubs, bikes, musical instruments, buggies and car seats. Rules vary by airline.'}]},
 {t:'drill',title:'Flight questions customers ask',sub:'Give accurate answers or check first.',lead:'Customer says',items:[
  {q:'"What\'s my baggage allowance?"',a:'"Let me check your booking. You have [X]kg in the hold and [X]kg of cabin baggage. If you need more, I can add extra now, which is cheaper than at the airport."',tip:'Quote from the booking, then offer extra weight.'},
  {q:'"Can I take my golf clubs / a bike?"',a:'"Yes, sports equipment can usually be added to the booking in advance. Let me check the airline\'s rules and the price for your flight."',tip:'Check the airline\'s policy. Fees and weights vary.'},
  {q:'"Can I take a pram or buggy?"',a:'"Most airlines let you take a buggy, often free of charge. Let me check the exact rules for your flight so I can be sure."',tip:'Verify, don\'t assume.'},
  {q:'"Can I pre-order a special meal?"',a:'"Of course. What type of meal do you need? I\'ll check availability for your flight and request it on the booking."',tip:'Take the dietary need exactly. Meals are requested in advance.'},
  {q:'"Can my child sit next to me?"',a:'"I\'d recommend reserving seats together so there\'s no worry on the day. I\'ll check the price for the seats on your flight."',tip:'Link the need (child) to the solution (seats).'},
  {q:'"What can I take in hand luggage?"',a:'"The airline and airport security have rules on size, weight and liquids. I\'ll send you the guidance for your flight so you have the exact details."',tip:'Point to official guidance. Rules change.'},
  {q:'"Do I need to arrive early at the airport?"',a:'"Check-in times depend on your airline and airport. I\'d recommend following the guidance on your confirmation. Would you like me to read it out?"',tip:'Quote the confirmation or airline guidance only.'},
  {q:'"Can I add a transfer from the airport?"',a:'"Yes, transfers can often be added before travel. Let me check the options and price for your destination."',tip:'Good moment to mention it is easier to arrange before travel.'}]},
 {t:'drill',title:'Special assistance and families',sub:'Take full details and give a clear next step.',lead:'Customer says',items:[
  {q:'"I need wheelchair assistance at the airport."',a:'"Of course. May I take the passenger\'s name, the type of assistance needed, and the flight details? It\'s best arranged at least [48 hours] before travel."',tip:'Follow your assistance procedure. Confirm in writing.'},
  {q:'"I use oxygen / medical equipment on board."',a:'"Thank you for telling me. The airline needs to approve this in advance, so I\'ll take the details and raise it straight away."',tip:'This needs airline approval. Escalate, don\'t promise.'},
  {q:'"I\'m pregnant. Can I still fly?"',a:'"Airlines have rules depending on how many weeks pregnant you are. Let me check the policy for your flight, and I\'d also suggest speaking to your doctor."',tip:'No medical advice. Check airline rules.'},
  {q:'"We\'re travelling with a baby under 2."',a:'"Lovely. Infants under 2 usually travel on a parent\'s lap, with their own booking. May I take the baby\'s date of birth and check the rules for your flight?"',tip:'Age on the date of travel decides the fare and rules.'},
  {q:'"Can my 15-year-old travel alone?"',a:'"Rules for under-18s depend on the airline and age. Let me check the policy for your flight and what paperwork is needed."',tip:'Check the airline\'s rules. Never guess.'},
  {q:'"Do we need passports and a visa for [destination]?"',a:'"Entry rules depend on your nationality and destination. For accurate information, I\'d recommend checking GOV.UK foreign travel advice before you travel."',tip:'Point to GOV.UK. Don\'t quote rules from memory.'}]},
 {t:'steps',title:'Pre-flight checklist for every booking',sub:'Run through this on any pre-travel call so nothing is missed.',steps:[
  {h:'Names match passports',p:'Every traveller\'s name exactly as on the passport. Fix errors early.'},
  {h:'Documents',p:'E-tickets and ATOL certificate sent. Passports valid. Entry rules via GOV.UK.'},
  {h:'Baggage',p:'Hold allowance, cabin bag size, any extras or special items.'},
  {h:'Seats and meals',p:'Seats together for families, special meals requested.'},
  {h:'Assistance and needs',p:'Wheelchair, medical, infants and children noted and confirmed.'},
  {h:'Transfers and payments',p:'Transfer arranged, balance due date and amount confirmed.'}]}
]},

{id:'rap',name:'Rapport (UK customers)',icon:'heart',acc:'#c2410c',soft:'#ffedd5',slides:[
 {t:'cards',title:'Rapport the British way',sub:'British customers like warmth that is calm, polite and not pushy. Friendly, never over-familiar.',cards:[
  {i:'smile',h:'Polite and understated',p:'Calm warmth beats loud enthusiasm. Use "please", "thank you", "lovely", "no problem at all".'},
  {i:'user',h:'Titles first',p:'Use Mr / Mrs / Ms [Surname] until they use their first name or invite you to. Then match them.'},
  {i:'chat',h:'Light small talk only',p:'Holiday plans, the destination, the weather. Keep it to one or two lines, then guide the call.'},
  {i:'lock',h:'Respect privacy',p:'Do not ask about age, job, income, marital status or health unless the booking truly needs it.'},
  {i:'heart',h:'Gentle humour only',p:'If they joke ("typical British weather!"), smile and play along briefly. Never be sarcastic or make the first joke about problems.'},
  {i:'clock',h:'Read their pace',p:'Short, quiet answers mean they want efficiency. Chatty customers get a little more warmth, then a polite steer back.'}]},
 {t:'drill',title:'Rapport openers that feel natural',sub:'One friendly question, then listen. Use what they tell you later in the call.',lead:'Customer says',items:[
  {q:'"We\'re going to Tenerife in August."',a:'"Lovely, Tenerife in August! Is it your first time there, or have you been before?"',tip:'"First time?" is the safest British-friendly question.'},
  {q:'"It\'s for me, my husband and the kids."',a:'"That sounds like a great family holiday. How old are the little ones? It helps me suggest the right seats and options."',tip:'Ask about children only when it helps the booking, and say why.'},
  {q:'"It\'s our 25th wedding anniversary."',a:'"Congratulations, that\'s wonderful! Let\'s make sure it\'s a really special trip. Is there anything you\'ve been dreaming about for it?"',tip:'Celebrate first, offer upgrades later.'},
  {q:'"Sorry, I\'m rambling on..."',a:'"Not at all, please take your time. I want to get this exactly right for you."',tip:'British customers apologise a lot. Reassure them, never rush them.'},
  {q:'"Typical British weather, we need some sun!"',a:'"Ha, I know the feeling! Hopefully we can get you somewhere sunny. What kind of break are you after?"',tip:'One light reply, then back to discovery.'},
  {q:'"Thanks, you\'ve been brilliant."',a:'"My pleasure, it\'s been lovely helping you. I hope you have a fantastic trip."',tip:'Accept thanks warmly and keep it short.'}]},
 {t:'drill',title:'Conversation starters (trip and general)',sub:'Ask one, listen, then follow up on their answer. Great during holds, system loading, or right after verification.',lead:'When',items:[
  {q:'After verification, to set a friendly tone',a:'"Thank you. So, are you looking forward to the trip?"',tip:'Easy, positive, and it gets them talking about the holiday.'},
  {q:'While your system is loading',a:'"While that loads, have you got anything planned for when you arrive?"',tip:'Turns dead time into rapport.'},
  {q:'General opener, not about the trip',a:'"I hope you\'re having a good week so far."',tip:'Safe, warm, very British-friendly.'},
  {q:'Learning their travel style',a:'"Are you more of a relax-by-the-pool person, or do you like exploring?"',tip:'The answer helps you suggest the right room, board basis or extras later.'},
  {q:'Customer travels with family',a:'"Are the children excited? Have they been on a plane before?"',tip:'Only if children are already mentioned.'},
  {q:'Returning TUI customer',a:'"Have you travelled with TUI before? What did you enjoy most last time?"',tip:'Builds loyalty and shows you value their history.'},
  {q:'Close to departure',a:'"Not long to go now! What\'s the first thing you\'ll do when you land?"',tip:'Ends the call on a happy picture.'},
  {q:'Before closing any call',a:'"Is there anything else that would make the trip better for you?"',tip:'Often reveals an extra: seats, transfer, room request.'}]},
 {t:'compare',title:'Questions that work vs questions to avoid',sub:'With UK customers, ask about the trip, not about the person.',left:'Good to ask',right:'Avoid',rows:[
  ['Is it your first time visiting?','How old are you?'],
  ['Who\'s travelling with you?','Are you married? Are you alone?'],
  ['Is it for a special occasion?','Why are you travelling alone?'],
  ['Do you have a budget in mind?','How much do you earn?'],
  ['What are you most looking forward to?','Where are you really from?'],
  ['Would you like any assistance arranged?','Do you have a disability?']]},
 {t:'drill',title:'Tricky rapport moments',sub:'Small cultural details that make a big difference.',lead:'Situation',items:[
  {q:'Customer greets you: "You alright?"',a:'"I\'m very well, thank you, and how are you? How can I help today?"',tip:'It is a greeting, not a real question. Answer briefly and return the question.'},
  {q:'Older customer calls you "love" or "dear"',a:'(Stay warm, don\'t correct them.) "Thank you, let\'s get this sorted for you."',tip:'It is friendly in the UK. Smile and carry on.'},
  {q:'Customer is quiet and short with answers',a:'"No problem, I\'ll keep this quick and simple. I just need [detail] and we\'ll be done in a couple of minutes."',tip:'Efficiency is their way of feeling looked after.'},
  {q:'Customer is very chatty and goes off topic',a:'"That sounds lovely. So I can make sure I get everything done for you, may I just confirm [detail]?"',tip:'Be warm, then steer gently with "so I can...".'},
  {q:'Customer says: "Sorry to be a bother."',a:'"You\'re not a bother at all, that\'s exactly what I\'m here for."',tip:'Reassure, then continue.'},

/* navigation */
const prog=document.getElementById('prog'),cnt=document.getElementById('cnt'),secname=document.getElementById('secname');
const prevB=document.getElementById('prev'),nextB=document.getElementById('next');
function go(n){
  n=Math.max(0,Math.min(total-1,n));idx=n;
  flat.forEach((f,i)=>{f.el.classList.toggle('active',i===n);f.el.classList.toggle('before',i<n)});
  const cur=flat[n];cur.el.scrollTop=0;
  navlist.querySelectorAll('.grp').forEach(g=>g.classList.toggle('active',g.dataset.sec===cur.sec.id));
  navlist.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('cur',+b.dataset.go===n));
  const act=navlist.querySelector('.grp.active');if(act)setTimeout(()=>act.scrollIntoView({block:'nearest',behavior:'smooth'}),60);
  prog.style.width=(total>1?n/(total-1)*100:100)+'%';
  cnt.textContent=(n+1)+' / '+total;secname.textContent=cur.sec.name;
  prevB.disabled=n===0;nextB.disabled=n===total-1;
  try{history.replaceState(null,'','#'+(n+1))}catch(e){}
}
prevB.onclick=()=>go(idx-1);nextB.onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')||document.getElementById('qf').classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(idx+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(idx-1);
  else if(e.key==='Home')go(0);else if(e.key==='End')go(total-1);
});

(function(){
  const el=flat.find(f=>f.d.t==='roleplay');if(!el)return;
  const root=el.el,scn=root.querySelector('#scn'),checks=root.querySelector('#checks');
  const ring=root.querySelector('#ringp'),sn=root.querySelector('#scoren'),sl=root.querySelector('#slabel'),sd=root.querySelector('#sdesc');
  let last=-1,secs=0,tmr=null;
  const lvlName={easy:'Easy',med:'Medium',hard:'Hard'};
  const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  function draw(){
    let i;do{i=Math.floor(Math.random()*SCENARIOS.length)}while(i===last&&SCENARIOS.length>1);last=i;const s=SCENARIOS[i];
    scn.innerHTML=`<div class="pop"><div class="lead">Scenario</div><span class="lvl ${s.lvl}">${lvlName[s.lvl]}</span><h3>${esc(s.title)}</h3><div class="kv"><div><b>Customer</b><span>${esc(s.persona)}</span></div><div><b>Situation</b><span>${esc(s.situation)}</span></div><div><b>Your goal</b><span>${esc(s.goal)}</span></div></div><div class="row"><span class="timer" id="tm">${fmtT(secs)}</span><button class="btn solid" id="tgo" type="button">${ic('play')}<span>Start</span></button><button class="btn ghost" id="trs" type="button">Reset</button><button class="btn" id="nw" type="button">${ic('shuffle')}<span>New scenario</span></button></div></div>`;
    clearInterval(tmr);tmr=null;secs=0;
    checks.querySelectorAll('input').forEach(c=>c.checked=false);score();
  }
  function score(){const n=checks.querySelectorAll('input:checked').length;sn.textContent=n+'/8';ring.style.strokeDashoffset=264*(1-n/8);const k=n<=3?0:n<=5?1:n<=7?2:3;sl.textContent=SCORE_LABEL[k][0];sd.textContent=SCORE_LABEL[k][1]}
  checks.addEventListener('change',score);
  scn.addEventListener('click',e=>{
    if(e.target.closest('#nw')){draw();return}
    if(e.target.closest('#trs')){clearInterval(tmr);tmr=null;secs=0;scn.querySelector('#tm').textContent=fmtT(0);scn.querySelector('#tgo span').textContent='Start';return}
    if(e.target.closest('#tgo')){const b=scn.querySelector('#tgo span');if(tmr){clearInterval(tmr);tmr=null;b.textContent='Resume'}else{tmr=setInterval(()=>{secs++;const t=scn.querySelector('#tm');if(t)t.textContent=fmtT(secs)},1000);b.textContent='Pause'}}
  });
  draw();
})();

(function(){

    card.style.setProperty('--acc',p.acc);card.style.setProperty('--soft',p.soft);
